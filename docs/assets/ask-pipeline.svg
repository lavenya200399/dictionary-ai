<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1640 600" width="1640" height="600" role="img"><style>
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.march{stroke-dasharray:6 8;animation:march 1.1s linear infinite}
@keyframes march{to{stroke-dashoffset:-14}}
.glow{animation:glow 3.2s ease-in-out infinite}
@keyframes glow{50%{stroke-opacity:.35}}
.scan{animation:scan 7.2s ease-in-out infinite}
@keyframes scan{0%,100%{fill:#172233;stroke:#2f4259}5%,15%{fill:#1c4a37;stroke:#5fb37c}22%{fill:#172233;stroke:#2f4259}}
.bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.35);opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f16"/><stop offset="1" stop-color="#111b2a"/></linearGradient><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".05"/></pattern></defs><rect width="1640" height="600" fill="url(#bg)"/><rect width="1640" height="600" fill="url(#dots)"/><g transform="translate(44 30) scale(1.0)"><rect x="0" y="0" width="30" height="38" rx="5" fill="none" stroke="#5b8def" stroke-width="3"/><path d="M8 0v38" stroke="#5b8def" stroke-width="3"/><path d="M14 11h10M14 18h10M14 25h6" stroke="#3fb4b0" stroke-width="3" stroke-linecap="round"/></g><text x="88" y="58" font-size="26" font-weight="700" fill="#e8ecf2" text-anchor="start" font-family="Georgia,'Times New Roman',serif" >How “Ask” works, and why it can&#x27;t hurt your data</text><text x="88" y="84" font-size="13.5" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >Every answer passes the same deterministic gate, whatever the model writes.</text><path d="M124.0 200 H1524.0" stroke="#2a3a50" stroke-width="3" fill="none"/><path id="p1" d="M124.0 200 H1524.0" fill="none" stroke="#7aa2ff" stroke-opacity=".55" stroke-width="2.2" stroke-linecap="round" class="march"/><circle r="3.6" fill="#7aa2ff"><animateMotion dur="9s" begin="0.00s" repeatCount="indefinite" ><mpath xlink:href="#p1" href="#p1"/></animateMotion></circle><circle r="3.6" fill="#7aa2ff"><animateMotion dur="9s" begin="3.00s" repeatCount="indefinite" ><mpath xlink:href="#p1" href="#p1"/></animateMotion></circle><circle r="3.6" fill="#7aa2ff"><animateMotion dur="9s" begin="6.00s" repeatCount="indefinite" ><mpath xlink:href="#p1" href="#p1"/></animateMotion></circle><rect x="44" y="150" width="160" height="100" rx="14" fill="#121b27" stroke="#7aa2ff" stroke-width="1.4" /><circle cx="66" cy="176" r="13" fill="#172233" stroke="#7aa2ff"/><text x="66" y="181" font-size="13" font-weight="700" fill="#7aa2ff" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >1</text><text x="86" y="181" font-size="14.5" font-weight="700" fill="#e8ecf2" text-anchor="start" font-family="Georgia,'Times New Roman',serif" >Question</text><text x="60" y="212" font-size="11.5" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >plain English</text><rect x="244" y="150" width="160" height="100" rx="14" fill="#121b27" stroke="#5b8def" stroke-width="1.4" /><circle cx="266" cy="176" r="13" fill="#172233" stroke="#5b8def"/><text x="266" y="181" font-size="13" font-weight="700" fill="#5b8def" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >2</text><text x="286" y="181" font-size="14.5" font-weight="700" fill="#e8ecf2" text-anchor="start" font-family="Georgia,'Times New Roman',serif" >Schema context</text><text x="260" y="212" font-size="11.5" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >profile · links</text><text x="260" y="229" font-size="11.5" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >+ glossary</text><rect x="444" y="150" width="160" height="100" rx="14" fill="#121b27" stroke="#9a8bd8" stroke-width="1.4" /><circle cx="466" cy="176" r="13" fill="#172233" stroke="#9a8bd8"/><text x="466" y="181" font-size="13" font-weight="700" fill="#9a8bd8" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >3</text><text x="486" y="181" font-size="14.5" font-weight="700" fill="#e8ecf2" text-anchor="start" font-family="Georgia,'Times New Roman',serif" >LLM plan</text><text x="460" y="212" font-size="11.5" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >Groq → JSON:</text><text x="460" y="229" font-size="11.5" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >sql, title, follow-ups</text><rect x="644" y="150" width="160" height="100" rx="14" fill="#121b27" stroke="#5fb37c" stroke-width="1.4" class="glow"/><circle cx="666" cy="176" r="13" fill="#172233" stroke="#5fb37c"/><text x="666" y="181" font-size="13" font-weight="700" fill="#5fb37c" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >4</text><text x="686" y="181" font-size="14.5" font-weight="700" fill="#e8ecf2" text-anchor="start" font-family="Georgia,'Times New Roman',serif" >Safety gate</text><text x="660" y="212" font-size="11.5" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >7 deterministic</text><text x="660" y="229" font-size="11.5" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >checks</text><rect x="844" y="150" width="160" height="100" rx="14" fill="#121b27" stroke="#3fb4b0" stroke-width="1.4" /><circle cx="866" cy="176" r="13" fill="#172233" stroke="#3fb4b0"/><text x="866" y="181" font-size="13" font-weight="700" fill="#3fb4b0" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >5</text><text x="886" y="181" font-size="14.5" font-weight="700" fill="#e8ecf2" text-anchor="start" font-family="Georgia,'Times New Roman',serif" >Execute</text><text x="860" y="212" font-size="11.5" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >read-only · row cap</text><text x="860" y="229" font-size="11.5" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >15 s timeout</text><rect x="1044" y="150" width="160" height="100" rx="14" fill="#121b27" stroke="#e3a04a" stroke-width="1.4" /><circle cx="1066" cy="176" r="13" fill="#172233" stroke="#e3a04a"/><text x="1066" y="181" font-size="13" font-weight="700" fill="#e3a04a" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >6</text><text x="1086" y="181" font-size="14.5" font-weight="700" fill="#e8ecf2" text-anchor="start" font-family="Georgia,'Times New Roman',serif" >Auto-chart</text><text x="1060" y="212" font-size="11.5" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >chosen from the</text><text x="1060" y="229" font-size="11.5" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >result&#x27;s shape</text><rect x="1244" y="150" width="160" height="100" rx="14" fill="#121b27" stroke="#9a8bd8" stroke-width="1.4" /><circle cx="1266" cy="176" r="13" fill="#172233" stroke="#9a8bd8"/><text x="1266" y="181" font-size="13" font-weight="700" fill="#9a8bd8" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >7</text><text x="1286" y="181" font-size="14.5" font-weight="700" fill="#e8ecf2" text-anchor="start" font-family="Georgia,'Times New Roman',serif" >Narrate</text><text x="1260" y="212" font-size="11.5" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >plain-English answer;</text><text x="1260" y="229" font-size="11.5" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >numbers only from rows</text><rect x="1444" y="150" width="160" height="100" rx="14" fill="#121b27" stroke="#7aa2ff" stroke-width="1.4" /><circle cx="1466" cy="176" r="13" fill="#172233" stroke="#7aa2ff"/><text x="1466" y="181" font-size="13" font-weight="700" fill="#7aa2ff" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >8</text><text x="1486" y="181" font-size="14.5" font-weight="700" fill="#e8ecf2" text-anchor="start" font-family="Georgia,'Times New Roman',serif" >Trust receipt</text><text x="1460" y="212" font-size="11.5" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >SQL · checks · rows</text><text x="1460" y="229" font-size="11.5" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >ms · attempts</text><path id="p2" d="M924.0 250 V300 H524.0 V250" fill="none" stroke="#e3a04a" stroke-opacity=".55" stroke-width="1.8" stroke-linecap="round" class="march"/><circle r="3.6" fill="#e3a04a"><animateMotion dur="6s" begin="0.00s" repeatCount="indefinite" ><mpath xlink:href="#p2" href="#p2"/></animateMotion></circle><circle r="3.6" fill="#e3a04a"><animateMotion dur="6s" begin="3.00s" repeatCount="indefinite" ><mpath xlink:href="#p2" href="#p2"/></animateMotion></circle><rect x="574.0" y="286" width="300" height="28" rx="14.0" fill="#2a2216" stroke="#e3a04a" stroke-width="1.2" class="" style=""/><text x="724.0" y="304.14" font-size="11.5" font-weight="600" fill="#e8ecf2" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >query fails → send the error back, retry once</text><rect x="44" y="350" width="1550" height="118" rx="14" fill="#121b27" stroke="#5fb37c" stroke-width="1.4" class="glow"/><text x="62" y="380" font-size="16" font-weight="700" fill="#e8ecf2" text-anchor="start" font-family="Georgia,'Times New Roman',serif" >Inside the safety gate</text><rect x="62" y="400" width="178" height="30" rx="15.0" fill="#172233" stroke="#5fb37c" stroke-width="1.2" class="scan" style="animation-delay:0.00s"/><text x="151.0" y="418.96" font-size="11" font-weight="600" fill="#e8ecf2" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >Parse with sqlglot</text><rect x="252" y="400" width="178" height="30" rx="15.0" fill="#172233" stroke="#5fb37c" stroke-width="1.2" class="scan" style="animation-delay:0.80s"/><text x="341.0" y="418.96" font-size="11" font-weight="600" fill="#e8ecf2" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >Exactly one statement</text><rect x="442" y="400" width="178" height="30" rx="15.0" fill="#172233" stroke="#5fb37c" stroke-width="1.2" class="scan" style="animation-delay:1.60s"/><text x="531.0" y="418.96" font-size="11" font-weight="600" fill="#e8ecf2" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >SELECT / WITH only</text><rect x="632" y="400" width="178" height="30" rx="15.0" fill="#172233" stroke="#5fb37c" stroke-width="1.2" class="scan" style="animation-delay:2.40s"/><text x="721.0" y="418.96" font-size="11" font-weight="600" fill="#e8ecf2" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >Known tables only</text><rect x="822" y="400" width="178" height="30" rx="15.0" fill="#172233" stroke="#5fb37c" stroke-width="1.2" class="scan" style="animation-delay:3.20s"/><text x="911.0" y="418.96" font-size="11" font-weight="600" fill="#e8ecf2" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >No unsafe functions</text><rect x="1012" y="400" width="178" height="30" rx="15.0" fill="#172233" stroke="#5fb37c" stroke-width="1.2" class="scan" style="animation-delay:4.00s"/><text x="1101.0" y="418.96" font-size="11" font-weight="600" fill="#e8ecf2" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >No system tables</text><rect x="1202" y="400" width="178" height="30" rx="15.0" fill="#172233" stroke="#5fb37c" stroke-width="1.2" class="scan" style="animation-delay:4.80s"/><text x="1291.0" y="418.96" font-size="11" font-weight="600" fill="#e8ecf2" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >Row cap + timeout</text><rect x="1392" y="400" width="178" height="30" rx="15.0" fill="#172233" stroke="#5fb37c" stroke-width="1.2" class="scan" style="animation-delay:5.60s"/><text x="1481.0" y="418.96" font-size="11" font-weight="600" fill="#e8ecf2" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >Read-only session</text><text x="62" y="452" font-size="12" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >A failed check never reaches the database; the user sees exactly which rule stopped it.</text><text x="44" y="497" font-size="13" font-weight="600" fill="#e8ecf2" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >A destructive request, for example “delete all cancelled rides”:</text><path d="M134 539 H714.0" stroke="#2a3a50" stroke-width="3" fill="none"/><path id="bl" d="M134 539 H714.0" fill="none"/><rect x="44" y="523" width="170" height="32" rx="16.0" fill="#2a1a19" stroke="#e0705f" stroke-width="1.2" class="" style=""/><text x="129.0" y="543.14" font-size="11.5" font-weight="600" fill="#e8ecf2" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >DELETE FROM rides</text><circle r="5" fill="#e0705f"><animateMotion dur="5s" repeatCount="indefinite"><mpath xlink:href="#bl" href="#bl"/></animateMotion><animate attributeName="opacity" values="1;1;0" keyTimes="0;.85;1" dur="5s" repeatCount="indefinite"/></circle><rect x="644" y="513" width="160" height="52" rx="12" fill="#2a1a19" stroke="#e0705f" stroke-width="1.4" /><text x="724.0" y="537" font-size="14" font-weight="700" fill="#e0705f" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >✕ BLOCKED</text><text x="724.0" y="555" font-size="11" font-weight="400" fill="#93a0b4" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >not a SELECT</text><path id="p3" d="M804 539 H864" fill="none" stroke="#e0705f" stroke-opacity=".55" stroke-width="1.8" stroke-linecap="round" class="march"/><circle r="3.6" fill="#e0705f"><animateMotion dur="2s" begin="0.00s" repeatCount="indefinite" ><mpath xlink:href="#p3" href="#p3"/></animateMotion></circle><rect x="864" y="513" width="420" height="52" rx="12" fill="#121b27" stroke="#e0705f" stroke-width="1.4" /><text x="882" y="535" font-size="12" font-weight="500" fill="#e8ecf2" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >Explains why, shows the failed check in the Trust Receipt,</text><text x="882" y="553" font-size="12" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >and leaves every row untouched. (Covered by an automated test.)</text></svg>