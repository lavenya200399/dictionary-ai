<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 400" width="1280" height="400" role="img"><style>
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.march{stroke-dasharray:6 8;animation:march 1.1s linear infinite}
@keyframes march{to{stroke-dashoffset:-14}}
.glow{animation:glow 3.2s ease-in-out infinite}
@keyframes glow{50%{stroke-opacity:.35}}
.scan{animation:scan 7.2s ease-in-out infinite}
@keyframes scan{0%,100%{fill:#172233;stroke:#2f4259}5%,15%{fill:#1c4a37;stroke:#5fb37c}22%{fill:#172233;stroke:#2f4259}}
.bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.35);opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.w1{animation:cyc 16s infinite}.w2{animation:cyc 16s infinite;animation-delay:4s}.w3{animation:cyc 16s infinite;animation-delay:8s}.w4{animation:cyc 16s infinite;animation-delay:12s}
@keyframes cyc{0%{opacity:0;transform:translateY(8px)}3%,22%{opacity:1;transform:none}25%,100%{opacity:0}}
.fl{animation:fl 9s ease-in-out infinite alternate}@keyframes fl{to{transform:translateY(-22px) rotate(2deg)}}
.caret{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}
.ring{stroke-dasharray:339;stroke-dashoffset:339;animation:ring 3s .6s ease-out forwards}@keyframes ring{to{stroke-dashoffset:19}}
.sh{animation:sh 5s ease-in-out infinite}@keyframes sh{0%{transform:translateX(-120%)}60%,100%{transform:translateX(220%)}}
</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f16"/><stop offset="1" stop-color="#111b2a"/></linearGradient><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".05"/></pattern></defs><rect width="1280" height="400" fill="url(#bg)"/><rect width="1280" height="400" fill="url(#dots)"/><text x="640" y="60" font-size="14" fill="#93a0b4" fill-opacity=".35" font-family="ui-monospace,Menlo,Consolas,monospace" class="fl" style="animation-delay:-0.0s">SELECT</text><text x="760" y="330" font-size="14" fill="#93a0b4" fill-opacity=".35" font-family="ui-monospace,Menlo,Consolas,monospace" class="fl" style="animation-delay:-1.1s">JOIN</text><text x="900" y="50" font-size="14" fill="#93a0b4" fill-opacity=".35" font-family="ui-monospace,Menlo,Consolas,monospace" class="fl" style="animation-delay:-2.2s">NULL</text><text x="1010" y="340" font-size="14" fill="#93a0b4" fill-opacity=".35" font-family="ui-monospace,Menlo,Consolas,monospace" class="fl" style="animation-delay:-3.3000000000000003s">GROUP BY</text><text x="560" y="340" font-size="14" fill="#93a0b4" fill-opacity=".35" font-family="ui-monospace,Menlo,Consolas,monospace" class="fl" style="animation-delay:-4.4s">median</text><text x="1150" y="160" font-size="14" fill="#93a0b4" fill-opacity=".35" font-family="ui-monospace,Menlo,Consolas,monospace" class="fl" style="animation-delay:-5.5s">schema</text><text x="70" y="340" font-size="14" fill="#93a0b4" fill-opacity=".35" font-family="ui-monospace,Menlo,Consolas,monospace" class="fl" style="animation-delay:-6.6000000000000005s">outlier</text><text x="330" y="40" font-size="14" fill="#93a0b4" fill-opacity=".35" font-family="ui-monospace,Menlo,Consolas,monospace" class="fl" style="animation-delay:-7.700000000000001s">KPI</text><g transform="translate(70 80.0)"><rect width="66" height="84" rx="10" fill="none" stroke="#5b8def" stroke-width="5"/><path d="M18 0v84" stroke="#5b8def" stroke-width="5"/><path d="M32 24h22M32 42h22M32 60h14" stroke="#3fb4b0" stroke-width="5" stroke-linecap="round"/></g><text x="168" y="148.0" font-size="78" font-weight="700" fill="#e8ecf2" text-anchor="start" font-family="Georgia,'Times New Roman',serif" letter-spacing="-2">Dictionary</text><text x="172" y="196.0" font-size="30" font-weight="600" fill="#7aa2ff" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-style="italic">Your data, defined.</text><text x="172" y="244.0" font-size="17" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >Connect any database, file, API or web table. Get a dashboard,</text><text x="172" y="268.0" font-size="17" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >a data-quality score, lineage, and safe plain-English answers.</text><rect x="172" y="296.0" width="92" height="28" rx="14.0" fill="#172233" stroke="#3fb4b0" stroke-width="1.2" class="" style=""/><text x="218.0" y="314.32" font-size="12" font-weight="600" fill="#e8ecf2" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >FastAPI</text><rect x="276" y="296.0" width="138" height="28" rx="14.0" fill="#172233" stroke="#5fb37c" stroke-width="1.2" class="" style=""/><text x="345.0" y="314.32" font-size="12" font-weight="600" fill="#e8ecf2" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >SQL safety gate</text><rect x="426" y="296.0" width="100" height="28" rx="14.0" fill="#172233" stroke="#9a8bd8" stroke-width="1.2" class="" style=""/><text x="476.0" y="314.32" font-size="12" font-weight="600" fill="#e8ecf2" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >Groq LLM</text><rect x="538" y="296.0" width="150" height="28" rx="14.0" fill="#172233" stroke="#e3a04a" stroke-width="1.2" class="" style=""/><text x="613.0" y="314.32" font-size="12" font-weight="600" fill="#e8ecf2" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >26 API endpoints</text><rect x="790" y="50.0" width="410" height="250" rx="18" fill="#121b27" stroke="#2a3a50" stroke-width="1.4" /><path d="M810 50.0H1180" stroke="#5b8def" stroke-width="4" stroke-linecap="round"/><g class="w1" opacity="0"><text x="818" y="120.0" font-size="40" font-weight="700" fill="#e8ecf2" text-anchor="start" font-family="Georgia,'Times New Roman',serif" >revenue</text><text x="981" y="120.0" font-size="18" font-weight="400" fill="#5b8def" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-style="italic">n.</text><text x="820" y="168.0" font-size="16" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >Income from sales, before costs.</text><text x="820" y="192.0" font-size="16" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >Defined once, used everywhere.</text></g><g class="w2" opacity="0"><text x="818" y="120.0" font-size="40" font-weight="700" fill="#e8ecf2" text-anchor="start" font-family="Georgia,'Times New Roman',serif" >outlier</text><text x="981" y="120.0" font-size="18" font-weight="400" fill="#5b8def" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-style="italic">n.</text><text x="820" y="168.0" font-size="16" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >A value far from the rest.</text><text x="820" y="192.0" font-size="16" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >Worth a look before you trust the average.</text></g><g class="w3" opacity="0"><text x="818" y="120.0" font-size="40" font-weight="700" fill="#e8ecf2" text-anchor="start" font-family="Georgia,'Times New Roman',serif" >null</text><text x="918" y="120.0" font-size="18" font-weight="400" fill="#5b8def" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-style="italic">n.</text><text x="820" y="168.0" font-size="16" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >A cell with no value.</text><text x="820" y="192.0" font-size="16" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >The quiet reason many averages are wrong.</text></g><g class="w4" opacity="0"><text x="818" y="120.0" font-size="40" font-weight="700" fill="#e8ecf2" text-anchor="start" font-family="Georgia,'Times New Roman',serif" >lineage</text><text x="981" y="120.0" font-size="18" font-weight="400" fill="#5b8def" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-style="italic">n.</text><text x="820" y="168.0" font-size="16" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >How one table traces back to another.</text><text x="820" y="192.0" font-size="16" font-weight="400" fill="#93a0b4" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" >Declared or inferred from the data.</text></g><rect x="818" y="218.0" width="3" height="22" fill="#5b8def" class="caret"/><g transform="translate(1104 204.0)"><circle cx="40" cy="40" r="35" fill="none" stroke="#172233" stroke-width="8"/><circle cx="40" cy="40" r="35" fill="none" stroke="#5fb37c" stroke-width="8" stroke-linecap="round" transform="rotate(-90 40 40)" stroke-dasharray="220" stroke-dashoffset="220"><animate attributeName="stroke-dashoffset" values="220;4;4" keyTimes="0;.3;1" dur="6s" repeatCount="indefinite"/></circle><text x="40" y="47" font-size="22" font-weight="700" fill="#e8ecf2" text-anchor="middle" font-family="Georgia,'Times New Roman',serif">99</text></g></svg>