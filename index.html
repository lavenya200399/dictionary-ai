<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dictionary – your data, defined</title>
<meta name="theme-color" content="#0e131a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
/* Dictionary theme: calm, enterprise palette */
:root{--bg:#0e131a;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.08);--line:rgba(255,255,255,.1);--ink:#e8ecf2;--muted:#8b97a8;--s1:#e0705f;--s2:#e3a04a;--s3:#c9b458;--s4:#5fb37c;--s5:#3fb4b0;--s6:#5b8def;--s7:#9a8bd8;--code:#0a0f15;--tt:#1b2330;--shadow:0 6px 24px rgba(0,0,0,.28)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f6f8;--panel:#fff;--panel2:#eef0f4;--line:#dfe3ea;--ink:#16202e;--muted:#5f6b7c;--s1:#cf4d3b;--s2:#cf7f1e;--s3:#a98f1c;--s4:#2f9459;--s5:#1c9a96;--s6:#2f62d6;--s7:#7a66c4;--code:#f1f3f7;--tt:#fff;--shadow:0 4px 18px rgba(30,45,80,.08)}}
:root[data-theme="light"]{--bg:#f5f6f8;--panel:#fff;--panel2:#eef0f4;--line:#dfe3ea;--ink:#16202e;--muted:#5f6b7c;--s1:#cf4d3b;--s2:#cf7f1e;--s3:#a98f1c;--s4:#2f9459;--s5:#1c9a96;--s6:#2f62d6;--s7:#7a66c4;--code:#f1f3f7;--tt:#fff;--shadow:0 4px 18px rgba(30,45,80,.08)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{color:var(--ink);font:15px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:radial-gradient(900px 520px at 88% -8%,color-mix(in srgb,var(--s7) 24%,transparent),transparent),radial-gradient(760px 460px at -6% 6%,color-mix(in srgb,var(--s5) 18%,transparent),transparent),radial-gradient(700px 400px at 60% 110%,color-mix(in srgb,var(--s1) 12%,transparent),transparent),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--s5);outline-offset:2px}
h1,h2,h3{margin:0}
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100dvh}
aside{position:sticky;top:0;height:100dvh;overflow:auto;padding:20px 14px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;font:800 1.35rem Georgia,serif;letter-spacing:-.02em;padding:0 8px 14px}
.brand svg{width:34px;height:34px}
.lbl{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.src,.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:12px;font-weight:600}
.src:hover,.nav:hover{background:var(--panel)}
.src.on,.nav.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--k,var(--s5))}
.src i{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
.src span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src small{display:block;color:var(--muted);font-weight:500;font-size:.75rem}
.src u{text-decoration:none;color:var(--muted);padding:0 6px;border-radius:6px;opacity:0}
.src:hover u{opacity:1}.src u:hover{background:var(--panel2);color:var(--s1)}
.src.add{color:var(--s5);border:1px dashed var(--line)}
.nav span{width:22px;text-align:center}
.foot{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);padding:10px}
.foot .dot{width:8px;height:8px;border-radius:50%;background:var(--s1)}.foot .dot.ok{background:var(--s4);box-shadow:0 0 8px var(--s4)}
.foot button{margin-left:auto;border:1px solid var(--line);background:none;border-radius:8px;padding:2px 8px}
main{padding:22px clamp(14px,3vw,34px) 60px;min-width:0}
.top{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font:800 1.7rem Georgia,serif;letter-spacing:-.02em}
.top small{color:var(--muted)}
.top .tr{margin-left:auto;display:flex;gap:10px;align-items:center}
.cmd{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 16px;color:var(--muted)}
kbd{font:600 .72rem monospace;border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin-left:8px}
.btn{border:0;border-radius:99px;padding:9px 18px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--s1),var(--s7))}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5}
.msel{display:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:6px 8px;max-width:150px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 14px;font-weight:600;font-size:.85rem}
.chip.on{background:linear-gradient(90deg,var(--s5),var(--s6));border-color:transparent;color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:8px}
.kpi{position:relative;overflow:hidden;padding-top:20px}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--a)}
.kpi small{color:var(--muted);font-weight:600;text-transform:capitalize}
.kpi b{display:block;font:800 2.1rem/1.1 Georgia,serif;margin:2px 0 4px}
.kpi em{font-style:normal;font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:99px}
.up{background:color-mix(in srgb,var(--s4) 22%,transparent);color:var(--s4)}.dn{background:color-mix(in srgb,var(--s1) 22%,transparent);color:var(--s1)}
.kpi svg{position:absolute;right:12px;bottom:12px;width:100px;height:34px;opacity:.9}
h3.sec{margin:26px 0 12px;font-size:1.05rem}
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.in{text-align:left;border-left:5px solid var(--a);transition:transform .15s,box-shadow .15s}
.in:hover{transform:translateY(-3px);box-shadow:0 14px 40px color-mix(in srgb,var(--a) 28%,transparent)}
.in>span{font-size:1.5rem}.in b{display:block;margin:2px 0}.in p{margin:0 0 8px;color:var(--muted);font-size:.88rem}.in u{text-decoration:none;color:var(--a);font-weight:700;font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;margin-top:14px;align-items:start}
.chh{display:flex;align-items:center;gap:8px;margin-bottom:8px}.chh b{flex:1;text-transform:capitalize}
.ib{border:1px solid var(--line);background:none;border-radius:8px;padding:2px 8px}
.cv{position:relative;height:250px}
details summary{cursor:pointer;color:var(--muted);font-size:.8rem;margin-top:8px}
pre{margin:8px 0 0;padding:12px 14px;background:var(--code);border:1px solid var(--line);border-radius:12px;font:.82rem/1.55 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.me{align-self:flex-end;max-width:85%;background:linear-gradient(90deg,var(--s6),var(--s7));color:#fff;padding:10px 16px;border-radius:18px 18px 4px 18px;font-weight:600}
.thread{display:flex;flex-direction:column;gap:16px;max-width:860px;margin:0 auto;padding-bottom:110px}
.ans h4{margin:0 0 6px;text-transform:capitalize;font-size:1.05rem}
.ans .txt{font-size:1.02rem;margin:0 0 12px}
.ans.no{border-left:6px solid var(--s1)}.ans.ok{border-left:6px solid var(--s4)}
.bigs{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}.bigs div{flex:1;min-width:140px;border-radius:14px;padding:12px;background:var(--panel2)}.bigs b{display:block;font:800 1.8rem Georgia,serif}.bigs small{color:var(--muted)}
.tw{overflow:auto;max-height:300px;border:1px solid var(--line);border-radius:12px;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:.85rem}th,td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{position:sticky;top:0;background:var(--panel2);color:var(--muted)}
.rc{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;font-size:.76rem}.rc>*{padding:2px 9px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.rc b{background:none;color:var(--ink);padding-left:0}.rc .ok{color:var(--s4)}.rc .bad{color:var(--s1)}
.fu{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.fu button,.acts button{border:1px solid var(--line);background:none;border-radius:99px;padding:4px 12px;font-size:.82rem}
.fu button:hover,.acts button:hover{border-color:var(--s5);color:var(--s5)}
.acts{display:flex;gap:8px;margin-top:10px}
.think{display:flex;gap:6px;align-items:center;color:var(--muted)}
.think i{width:9px;height:9px;border-radius:50%;animation:bn 1s infinite}.think i:nth-child(1){background:var(--s1)}.think i:nth-child(2){background:var(--s3);animation-delay:.15s}.think i:nth-child(3){background:var(--s5);animation-delay:.3s}
@keyframes bn{50%{transform:translateY(-7px)}}
.comp{position:fixed;left:268px;right:0;bottom:0;padding:14px clamp(14px,3vw,34px) calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%)}
.cf{max-width:860px;margin:0 auto;display:flex;gap:8px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);border-radius:99px;padding:6px 6px 6px 20px;box-shadow:var(--shadow)}
.cf input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font:inherit}
.sug{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:24px 0}
.sug button{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 14px;max-width:290px;text-align:left}
.sug button:hover{border-color:var(--s5)}
.empty{text-align:center;padding:4vh 0}
.empty h2{font:800 clamp(1.8rem,4vw,2.8rem)/1.1 Georgia,serif;letter-spacing:-.02em;margin:12px 0 10px}
.empty p{color:var(--muted);max-width:56ch;margin:0 auto 22px}
.empty .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;max-width:760px;margin:0 auto}
.opt{text-align:left;border-top:5px solid var(--a);transition:transform .15s}.opt:hover{transform:translateY(-4px)}.opt b{display:block}.opt small{color:var(--muted)}
.beam{stroke-dasharray:8 6;animation:fl 1.4s linear infinite}@keyframes fl{to{stroke-dashoffset:-28}}
.mapc{padding:0;position:relative;height:min(62vh,560px)}.mapc canvas{width:100%;height:100%;display:block;border-radius:20px;touch-action:none}
.mapc .legend{position:absolute;left:16px;bottom:12px;font-size:.78rem;color:var(--muted)}
.maptools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.maptools input,.maptools select{min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit}.maptools input{flex:1;min-width:190px}.mapdetails{margin-top:14px;padding:18px}.maprel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.85rem}.mapbadge{border:1px solid var(--line);border-radius:99px;padding:3px 8px;color:var(--muted);font-size:.74rem}.mapfields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin:10px 0 16px}.mapfield{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.col{display:grid;grid-template-columns:78px minmax(80px,1fr) 56px minmax(100px,auto);gap:10px;align-items:center;padding:5px 0;font-size:.85rem;border-bottom:1px dashed var(--line)}
.col small{color:var(--muted);text-align:right}
.k{font-size:.7rem;font-weight:700;text-align:center;border-radius:99px;padding:1px 6px;background:color-mix(in srgb,var(--k) 22%,transparent);color:var(--k)}
.k-id{--k:var(--s6)}.k-measure{--k:var(--s4)}.k-category{--k:var(--s2)}.k-temporal{--k:var(--s5)}.k-boolean{--k:var(--s3)}.k-geo{--k:var(--s1)}.k-text{--k:var(--s7)}
.nb{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}.nb i{display:block;height:100%;background:var(--s4)}
.tb summary{display:flex;gap:12px;align-items:center;margin:0 0 8px;color:var(--ink);font-size:1rem}.tb summary span{margin-left:auto;color:var(--muted);font-size:.8rem}
.gl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.gl input{flex:1;min-width:140px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit}
.term{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}.term b{color:var(--s2)}.term span{flex:1}.term button{border:0;background:none;color:var(--muted)}
.bd{position:fixed;inset:0;z-index:50;background:rgba(5,8,20,.6);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.md{width:min(560px,100%);max-height:90dvh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.md h2{margin-bottom:14px;font:800 1.4rem Georgia,serif}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 14px;font-weight:600}.tabs .on{background:var(--panel2);border-color:var(--s5)}
.fld{display:block;margin-bottom:12px;font-size:.82rem;font-weight:600;color:var(--muted)}
.fld input,.fld textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}
.note{font-size:.8rem;color:var(--muted);margin:8px 0 14px}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.brief p,.brief li{margin:6px 0}.brief ul{padding-left:20px}
.cq{width:100%;border:0;border-bottom:2px solid var(--s5);background:none;color:var(--ink);font:600 1.2rem inherit;padding:8px 2px;outline:0}
.skel{border-radius:20px;height:120px;background:linear-gradient(100deg,var(--panel) 30%,var(--panel2) 50%,var(--panel) 70%);background-size:300% 100%;animation:sh 1.3s infinite}@keyframes sh{to{background-position:-100% 0}}
#toast{position:fixed;right:16px;bottom:16px;z-index:99;display:grid;gap:8px}.toast{background:var(--s4);color:#06210f;font-weight:700;padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);max-width:340px}.toast.bad{background:var(--s1);color:#fff}
.tabbar{display:none}
@media(max-width:860px){
.shell{grid-template-columns:1fr}aside{display:none}.msel{display:block}.cmd{display:none}.top h1{font-size:1.35rem}
.tabbar{display:flex;position:fixed;z-index:20;inset:auto 0 0 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:.68rem;color:var(--muted);font-weight:700;gap:1px}.tabbar button span{font-size:1.25rem}.tabbar .on{color:var(--s5)}
main{padding-bottom:96px}.comp{left:0;bottom:62px}.grid,.grid2{grid-template-columns:1fr}.col{grid-template-columns:70px 1fr 44px}.col small{display:none}.thread{padding-bottom:140px}}
@media print{aside,.tabbar,.cmd,.comp,.btn,.ib,#toast,.msel{display:none!important}.shell{display:block}body{background:#fff;color:#000}body:has(.bd) .shell{display:none}.bd{position:static;background:none}.md{box-shadow:none;border:0;width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Dictionary: professional theme & motion ===== */
.chh b,.ans h4{text-transform:none}
body{background:var(--bg)}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(40% 40% at 18% 12%,color-mix(in srgb,var(--s6) 13%,transparent),transparent),radial-gradient(34% 34% at 88% 82%,color-mix(in srgb,var(--s5) 9%,transparent),transparent);animation:drift 28s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,3%,0) scale(1.08)}}
.brand{font:700 1.3rem Georgia,serif}
.card{position:relative;border-radius:14px;box-shadow:var(--shadow);transition:transform .22s,border-color .22s,box-shadow .22s}
.card:hover{border-color:color-mix(in srgb,var(--s6) 45%,var(--line))}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(240px circle at var(--mx,50%) var(--my,-60%),color-mix(in srgb,var(--s6) 11%,transparent),transparent 70%);opacity:0;transition:opacity .25s}
.card:hover::after{opacity:1}
.btn{background:var(--s6);border-radius:10px;font-weight:600;transition:filter .2s,transform .2s}
.btn:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
.btn.ghost{background:none}
.me{background:var(--s6);border-radius:14px 14px 4px 14px;font-weight:500}
.chip{transition:all .18s}.chip:hover{border-color:var(--s6)}.chip.on{background:var(--s6);color:#fff;border-color:transparent}
.cmd{border-radius:10px}.kpi::before{height:3px}.kpi{border-radius:14px}
.top h1,.empty h2{font-family:Georgia,"Times New Roman",serif}
.nav,.src{transition:background .2s,transform .2s}.nav:hover{transform:translateX(3px)}
.nav.on,.src.on{box-shadow:inset 3px 0 0 var(--s6)}
.nav span{font:700 .9rem Georgia,serif;color:var(--s6)}
.in:hover{box-shadow:var(--shadow);transform:translateY(-3px)}
.thread .me{animation:rise .4s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}}
main.anim .card,main.anim .chip,main.anim .sug button{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
.nb i,.tr i,.imp i,.db i{transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
.kpi svg polyline{stroke-dasharray:1;stroke-dashoffset:1;animation:dash 1.6s .3s ease forwards}@keyframes dash{to{stroke-dashoffset:0}}
.md{animation:popin .28s cubic-bezier(.2,.9,.3,1.15)}@keyframes popin{from{opacity:0;transform:scale(.94) translateY(10px)}}
.md.wide{width:min(1000px,100%)}
.bd{animation:fadein .2s}@keyframes fadein{from{opacity:0}}
.toast{animation:slidein .35s cubic-bezier(.2,.9,.3,1.15)}@keyframes slidein{from{opacity:0;transform:translateX(34px)}}
.toast{background:var(--s4);color:#fff}.toast.bad{background:var(--s1)}
.nl{color:var(--muted);font-size:.8em}
/* empty / hero */
.empty{position:relative;overflow:hidden;padding:6vh 0 4vh}
.fw{position:absolute;font:600 .85rem ui-monospace,Menlo,monospace;color:var(--muted);opacity:.28;animation:flt 9s ease-in-out infinite alternate;pointer-events:none}
@keyframes flt{to{transform:translateY(-24px) rotate(2deg)}}
.hero-entry{max-width:560px;margin:0 auto 30px;text-align:left;min-height:128px}
.hero-entry h3{display:flex;align-items:baseline;gap:12px;font:700 2rem Georgia,serif;min-height:2.6rem}
.pos{font:italic .95rem Georgia,serif;color:var(--s6)}
.def{color:var(--muted);margin:4px 0 12px}
#tw-d::after{content:"▌";color:var(--s6);animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}
.empty h2{position:relative}.empty>p,.empty .opts{position:relative}
.opt{border-top:3px solid var(--a)}
/* dictionary */
.dlook{margin-bottom:14px}.dlook .cq{font:600 1.15rem Georgia,serif;margin-bottom:14px}
.az{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.az button:not(.chip){width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:none;font:600 .9rem Georgia,serif;transition:all .15s}.az button:not(.chip):hover{background:var(--s6);color:#fff;border-color:transparent}
.entry{margin-bottom:14px;scroll-margin-top:16px}.entry h3{display:flex;align-items:baseline;gap:12px;font:700 1.5rem Georgia,serif;margin:0}
.sense{display:grid;grid-template-columns:26px minmax(130px,230px) 1fr 70px;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:.88rem;align-items:center}
.sense b{font:600 1rem Georgia,serif}.sense em{color:var(--muted);font-style:normal}.num{color:var(--muted)}
/* quality */
.qhead{display:grid;grid-template-columns:auto 1fr auto;gap:30px;align-items:center}

.rv{font:700 34px Georgia,serif;fill:var(--ink)}.rl{font:11px "Segoe UI",sans-serif;fill:var(--muted)}
.dim{display:grid;grid-template-columns:110px 1fr 42px;gap:12px;align-items:center;margin:8px 0;font-size:.9rem}
.db{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}.db i{display:block;height:100%;border-radius:4px}
.sevs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.sevs div{text-align:center;padding:10px 18px;border-radius:12px;background:color-mix(in srgb,var(--a) 14%,transparent);border-top:3px solid var(--a)}.sevs b{display:block;font:700 1.6rem Georgia,serif;color:var(--a)}.sevs small{color:var(--muted);text-transform:capitalize}

.mm{display:flex;flex-wrap:wrap;gap:4px}.mm i{width:16px;height:24px;border-radius:4px;background:color-mix(in srgb,var(--s1) calc(var(--p)*1%),color-mix(in srgb,var(--s4) 38%,var(--panel2)));animation:cell .5s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--j)*18ms);transition:transform .15s}.mm i:hover{transform:scale(1.35)}
@keyframes cell{from{opacity:0;transform:scale(.3)}}
.issues{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px}
.iss{border-left:4px solid var(--a)}.ih{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ih b{font-weight:600}
.sev{font-size:.66rem;font-weight:700;letter-spacing:.07em;padding:2px 8px;border-radius:4px;background:color-mix(in srgb,var(--a) 16%,transparent);color:var(--a)}
.where{margin-left:auto;font:600 .76rem ui-monospace,Menlo,monospace;color:var(--muted)}
.iss p{margin:8px 0;color:var(--muted);font-size:.9rem}
.imp{height:4px;border-radius:2px;background:var(--panel2);margin:10px 0}.imp i{display:block;height:100%;border-radius:2px;background:var(--a)}
.scan{position:relative;overflow:hidden;min-height:230px;text-align:center;padding-top:26px}
.scanl{display:grid;gap:12px;max-width:520px;margin:0 auto 18px}.scanl i{height:16px;border-radius:6px;background:var(--panel2)}.scanl i:nth-child(2){width:80%}.scanl i:nth-child(3){width:92%}.scanl i:nth-child(4){width:64%}.scanl i:nth-child(5){width:75%}
.scan::after{content:"";position:absolute;left:0;right:0;height:70px;background:linear-gradient(transparent,color-mix(in srgb,var(--s5) 26%,transparent),transparent);animation:sweep 1.7s linear infinite}
@keyframes sweep{from{top:-70px}to{top:100%}}
@media(max-width:860px){.qhead{grid-template-columns:1fr;justify-items:center}.sevs{grid-template-columns:repeat(4,1fr)}.sense{grid-template-columns:22px 1fr 56px}.sense em{grid-column:2/4;grid-row:2}.mrow{grid-template-columns:80px 1fr 36px}.issues{grid-template-columns:1fr}.tabbar button{font-size:.62rem}}
@media(prefers-reduced-motion:reduce){body::before,.fw,.scan::after{animation:none}}

body{background-image:radial-gradient(ellipse at 80% -10%,#8c9bff24,transparent 38%),radial-gradient(ellipse at 0% 50%,#d39bff12,transparent 32%),linear-gradient(135deg,var(--bg),var(--bg))}

<body>
<div class="shell"><aside id="side"></aside><main id="main"></main></div>
<nav class="tabbar" id="tabbar"></nav><div id="modal"></div><div id="toast"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt=n=>{n=+n;if(!isFinite(n))return'–';const a=Math.abs(n);if(a>=1e9)return(n/1e9).toFixed(2)+'B';if(a>=1e6)return(n/1e6).toFixed(2)+'M';if(a>=1e4)return(n/1e3).toFixed(1)+'K';return n%1?n.toLocaleString(undefined,{maximumFractionDigits:2}):n.toLocaleString()};
const NAV=[['home','Home','⌂','Home'],['auto','Autopilot','◈','Autopilot dashboard'],['ask','Ask','?','Ask your data'],['qa','Quality','✔','Data quality'],['map','Constellation','◎','Data constellation'],['board','Board','▣','Pinned board'],['data','Dictionary','Aa','Data dictionary']];
const KC={anomaly:'var(--s1)',trend:'var(--s2)',concentration:'var(--s3)',relationship:'var(--s5)',quality:'var(--s7)',peak:'var(--s4)'},KI={anomaly:'⚠',trend:'↗',concentration:'◔',relationship:'⇄',quality:'◌',peak:'▲'};
const S={src:[],sid:localStorage.sid||null,view:'home',prof:null,auto:null,qa:null,th:{},health:{},raf:0,contractTable:null,trPreview:null,trTable:null,trColumn:null,trActions:{},mapSearch:'',mapKind:'all',mapSelected:null,mapTarget:null,mapPath:[]};let CH=[];
const thread=()=>S.th[S.sid]??=[];
async function api(p,o={}){const h={};let b=o.body;if(b&&!(b instanceof FormData)){h['Content-Type']='application/json';b=JSON.stringify(b)}
const r=await fetch('/api'+p,{method:o.method||'GET',headers:h,body:b});if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail||m}catch{}throw new Error(m)}return r.json()}
const toast=(m,bad)=>{const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=m;$('#toast').append(t);setTimeout(()=>t.remove(),4500)};
const LOGO='<svg viewBox="0 0 40 40"><rect x="7" y="4" width="26" height="32" rx="4" fill="none" stroke="var(--s6)" stroke-width="2.6"/><path d="M14 4v32" stroke="var(--s6)" stroke-width="2.6"/><path d="M20 13h9M20 19h9M20 25h5" stroke="var(--s5)" stroke-width="2.6" stroke-linecap="round"/></svg>';

/* ───────── charts ───────── */
function killCharts(){CH.forEach(c=>c.destroy());CH=[]}
function draw(cv,sp,pick){const P=['--s6','--s5','--s2','--s7','--s4','--s1','--s3'].map(cssv),mu=cssv('--muted'),gr=cssv('--line'),ink=cssv('--ink'),tt=cssv('--tt'),t=sp.type,x=cv.getContext('2d');let ds,type='bar';
const ax={ticks:{color:mu,font:{size:11},padding:6},border:{display:false}};
const o={responsive:true,maintainAspectRatio:false,animation:{duration:1000,easing:'easeOutQuart',delay:c=>c.type==='data'&&c.mode==='default'?c.dataIndex*28:0},interaction:{mode:'nearest',intersect:true},
onClick:(e,el)=>{if(el.length&&pick&&sp.x)pick(sp.x[el[0].index])},onHover:(e,el)=>{cv.style.cursor=el.length&&pick&&sp.x?'pointer':'default'},
plugins:{legend:{display:false},tooltip:{backgroundColor:tt,titleColor:ink,bodyColor:ink,borderColor:gr,borderWidth:1,padding:10,cornerRadius:8,boxPadding:4,callbacks:{label:c=>' '+(c.dataset.label&&t!=='doughnut'?c.dataset.label+': ':'')+fmt(t==='hbar'?c.parsed.x:(c.parsed.y??c.parsed))}}},
scales:{x:{...ax,grid:{display:false}},y:{...ax,grid:{color:gr,drawTicks:false},ticks:{...ax.ticks,callback:v=>fmt(v)}}}};
const plugins=[];
if(t==='doughnut'){type='doughnut';ds=[{data:sp.series[0].data,backgroundColor:sp.x.map((_,i)=>P[i%P.length]),borderColor:tt,borderWidth:2,hoverOffset:6}];o.cutout='70%';o.scales={};o.plugins.legend={display:true,position:'right',labels:{color:mu,usePointStyle:true,boxWidth:8,padding:12}};
plugins.push({id:'ct',afterDraw(ch){const a=ch.chartArea,c=ch.ctx,tot=sp.series[0].data.reduce((s,v)=>s+v,0);c.save();c.textAlign='center';c.fillStyle=ink;c.font='600 21px Georgia,serif';c.fillText(fmt(tot),(a.left+a.right)/2,(a.top+a.bottom)/2+4);c.fillStyle=mu;c.font='11px Segoe UI,sans-serif';c.fillText('total',(a.left+a.right)/2,(a.top+a.bottom)/2+22);c.restore()}})}
else if(t==='line'){type='line';ds=sp.series.map((s,i)=>{const c=P[i%P.length],g=x.createLinearGradient(0,0,0,250);g.addColorStop(0,c+'40');g.addColorStop(1,c+'00');return{label:s.name,data:s.data,borderColor:c,backgroundColor:g,fill:true,tension:.3,pointRadius:0,pointHoverRadius:5,pointHoverBackgroundColor:c,borderWidth:2}});o.interaction={mode:'index',intersect:false};o.plugins.legend={display:sp.series.length>1,labels:{color:mu,usePointStyle:true,boxWidth:8}}}
else if(t==='scatter'){type='scatter';ds=[{data:sp.points,backgroundColor:P[0]+'99',pointRadius:3}];o.scales.x={...ax,grid:{color:gr},ticks:{...ax.ticks,callback:v=>fmt(v)}}}
else{ds=sp.series.map((s,i)=>({label:s.name,data:s.data,backgroundColor:sp.series.length>1?P[i%P.length]:t==='hbar'?sp.x.map((_,j)=>j===0?P[0]:P[0]+'99'):P[0],hoverBackgroundColor:P[sp.series.length>1?i%P.length:0],borderRadius:4,barPercentage:.72,categoryPercentage:.8}));o.plugins.legend={display:sp.series.length>1,labels:{color:mu,usePointStyle:true,boxWidth:8}};
if(t==='hbar'){o.indexAxis='y';o.scales={x:{...ax,grid:{color:gr,drawTicks:false},ticks:{...ax.ticks,callback:v=>fmt(v)}},y:{...ax,grid:{display:false}}}}}
CH.push(new Chart(cv,{type,data:{labels:t==='scatter'?undefined:sp.x,datasets:ds},options:o,plugins}))}
const spark=a=>{if(!a||a.length<2)return'';const mx=Math.max(...a),mn=Math.min(...a),r=mx-mn||1,p=a.map((v,i)=>`${(i/(a.length-1)*100).toFixed(1)},${(30-(v-mn)/r*26).toFixed(1)}`).join(' ');return`<svg viewBox="0 0 100 34" preserveAspectRatio="none"><polyline pathLength="1" points="${p}" fill="none" stroke="var(--a)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`};
const countUp=()=>document.querySelectorAll('[data-v]').forEach(e=>{const v=+e.dataset.v,t0=performance.now();(function f(n){const u=Math.min(1,(n-t0)/900);e.textContent=fmt(v*(1-Math.pow(1-u,3)));u<1&&requestAnimationFrame(f)})(t0)});

/* ───────── layout ───────── */
function sideHTML(){return`<div class="brand">${LOGO}Dictionary</div><div class="lbl">Data sources</div>${S.src.map((s,i)=>`<button class="src ${s.id===S.sid?'on':''}" style="--k:var(--s${i%7+1})" data-act="pick" data-arg="${s.id}"><i style="background:var(--s${i%7+1});color:var(--s${i%7+1})"></i><span>${esc(s.name)}<small>${s.kind==='db'?esc(s.dialect):esc(s.kind)}</small></span><u data-act="delsrc" data-arg="${s.id}" title="Remove source">×</u></button>`).join('')}<button class="src add" data-act="add">＋ Connect data</button><div class="lbl">Explore</div>${NAV.map(n=>`<button class="nav ${S.view===n[0]?'on':''}" data-act="view" data-arg="${n[0]}"><span>${n[2]}</span>${n[1]}</button>`).join('')}<div class="foot"><span class="dot ${S.health.llm?'ok':''}"></span>${S.health.llm?'AI ready':'AI key missing'}<button data-act="theme" title="Toggle theme">◐</button></div>`}
const topHTML=()=>{const s=S.src.find(x=>x.id===S.sid)||{};return`<div class="top"><div><h1>${NAV.find(n=>n[0]===S.view)[3]}</h1><small>${esc(s.name||'')}</small></div><div class="tr"><select class="msel" id="msel">${S.src.map(x=>`<option value="${x.id}" ${x.id===S.sid?'selected':''}>${esc(x.name)}</option>`).join('')}<option value="+">＋ Connect data…</option></select><button class="btn ghost" data-act="home" title="Go to home">⌂ Home</button><button class="cmd" data-act="cmd">Ask anything<kbd>Ctrl K</kbd></button><button class="btn" data-act="brief">Brief</button></div></div>`};
const skel=n=>Array.from({length:n||3},()=>'<div class="skel" style="margin-bottom:14px"></div>').join('');
function emptyHTML(){const W=['SUM','AVG','JOIN','NULL','KPI','GROUP BY','median','cohort','outlier','schema'];return`<div class="empty">${W.map((w,i)=>`<span class="fw" style="left:${6+i*9.5}%;top:${8+(i*37)%70}%;animation-delay:-${i*1.3}s">${w}</span>`).join('')}<div class="card entry hero-entry"><h3><span id="tw-h"></span><span class="pos" id="tw-p"></span></h3><p class="def" id="tw-d"></p></div><h2>Your data, defined.</h2><p>Connect a database, upload files or call an API. Dictionary documents every table and column, checks your data quality, and answers questions in plain English.</p><div class="opts"><button class="card opt" style="--a:var(--s6)" data-act="add" data-arg="db"><b>Database</b><small>Postgres, MySQL, SQLite…</small></button><button class="card opt" style="--a:var(--s5)" data-act="add" data-arg="file"><b>Files</b><small>CSV, Excel, JSON, Parquet</small></button><button class="card opt" style="--a:var(--s2)" data-act="add" data-arg="api"><b>REST API</b><small>Any JSON endpoint</small></button><button class="card opt" style="--a:var(--s7)" data-act="add" data-arg="web"><b>Web tables</b><small>Scrape tables from a public page</small></button><button class="card opt" style="--a:var(--s4)" data-act="sample"><b>Try sample data</b><small>Ride-share, 5 tables</small></button></div></div>`}
const sl=ms=>new Promise(r=>setTimeout(r,ms));
function typer(){const h=$('#tw-h');if(!h)return;const L=[['revenue','n.','Income from sales, before costs. Defined once, used everywhere.'],['churn','n.','The share of customers who stop buying in a period.'],['outlier','n.','A value far from the rest. Worth a second look before you trust the average.'],['null','n.','A cell with no value. The quiet reason many averages are wrong.']];
if(matchMedia('(prefers-reduced-motion:reduce)').matches){$('#tw-h').textContent=L[0][0];$('#tw-p').textContent=L[0][1];$('#tw-d').textContent=L[0][2];return}
(async()=>{let i=0;while(document.contains(h)){const[w,pos,d]=L[i++%L.length],p=$('#tw-p'),de=$('#tw-d');if(!p||!de)return;h.textContent=p.textContent=de.textContent='';for(const ch of w){h.textContent+=ch;await sl(80)}p.textContent=pos;for(const ch of d){de.textContent+=ch;await sl(16)}await sl(2400)}})()}
function render(){killCharts();cancelAnimationFrame(S.raf);$('#side').innerHTML=sideHTML();$('#tabbar').innerHTML=NAV.map(n=>`<button class="${S.view===n[0]?'on':''}" data-act="view" data-arg="${n[0]}"><span>${n[2]}</span>${n[1]}</button>`).join('');
const m=$('#main');if(!S.sid){m.innerHTML=emptyHTML();typer();return}
m.innerHTML=topHTML()+VIEWS[S.view]();document.querySelectorAll('#main .card,#main .chip,#main .entry,#main .sug button').forEach((e,i)=>e.style.setProperty('--i',Math.min(i,16)));AFTER[S.view]?.()}
const pop=()=>{const m=$('#main');if(!m)return;m.classList.remove('anim');void m.offsetWidth;m.classList.add('anim');clearTimeout(pop.t);pop.t=setTimeout(()=>m.classList.remove('anim'),1600)};
const go=v=>{S.view=v;render();pop();scrollTo(0,0)};
async function loadSources(){S.src=await api('/sources');if(!S.src.find(s=>s.id===S.sid))S.sid=S.src[0]?.id||null}
async function load(){S.prof=S.auto=S.qa=null;S.trPreview=null;render();if(!S.sid)return;localStorage.sid=S.sid;
try{[S.prof,S.auto]=await Promise.all([api(`/sources/${S.sid}/profile`),api(`/sources/${S.sid}/autopilot`)])}catch(e){toast(e.message,1)}render();pop()}

/* ───────── views ───────── */
const VIEWS={},AFTER={};
VIEWS.home=()=>{const p=S.prof,t=p?.tables||[],rows=t.reduce((n,x)=>n+x.rows,0),links=p?.relationships?.length||0;return`<section class="homehero card"><div><span class="pos">YOUR DATA, DEFINED</span><h2>Welcome to your data desk.</h2><p>One place to explore your sources, check their quality, and shape a clean dataset for download.</p><div class="row"><button class="btn" data-act="view" data-arg="auto">Explore dashboard</button><button class="btn ghost" data-act="view" data-arg="qa">Open quality studio</button></div></div><div class="homeglyph">Aa</div></section><div class="kpis"><div class="card kpi" style="--a:var(--s6)"><small>Connected sources</small><b>${S.src.length}</b></div><div class="card kpi" style="--a:var(--s5)"><small>Tables in this source</small><b>${t.length}</b></div><div class="card kpi" style="--a:var(--s2)"><small>Records mapped</small><b>${fmt(rows)}</b></div><div class="card kpi" style="--a:var(--s7)"><small>Discovered links</small><b>${links}</b></div></div><h3 class="sec">Open a chapter</h3><div class="opts"><button class="card opt" style="--a:var(--s6)" data-act="view" data-arg="data"><b>Data dictionary</b><small>Look up fields, definitions, and connections.</small></button><button class="card opt" style="--a:var(--s1)" data-act="view" data-arg="qa"><b>Quality & transformation</b><small>Set contracts, investigate findings, clean, aggregate, export.</small></button><button class="card opt" style="--a:var(--s7)" data-act="view" data-arg="map"><b>Data constellation</b><small>See how your tables orbit around each other.</small></button><button class="card opt" style="--a:var(--s2)" data-act="add"><b>Add a source</b><small>Database, file, API, or public web tables.</small></button></div>`};
VIEWS.auto=()=>{const a=S.auto;if(!a)return skel(4);if(a.empty)return'<div class="card">No tables found in this source.</div>';
return`<div class="chips">${a.tables.map(t=>`<button class="chip ${t===a.table?'on':''}" data-act="tbl" data-arg="${esc(t)}">${esc(t)}</button>`).join('')}<button class="chip" data-act="print">Export</button></div>
<div class="kpis">${a.kpis.map((k,i)=>`<div class="card kpi" style="--a:var(--s${[1,5,4,2,7,3][i%6]})"><small>${esc(k.label)}</small><b data-v="${k.value}">${fmt(k.value)}</b>${k.delta!=null?`<em class="${k.delta>=0?'up':'dn'}">${k.delta>=0?'▲':'▼'} ${Math.abs(k.delta).toFixed(1)}% vs prev</em>`:''}${spark(k.spark)}</div>`).join('')}</div>
${a.insights.length?`<h3 class="sec">Insight radar <small style="color:var(--muted);font-weight:500">· found automatically, click to dig in</small></h3><div class="ins">${a.insights.map(i=>`<button class="card in" style="--a:${KC[i.kind]}" data-act="ask" data-arg="${esc(i.ask)}"><span>${KI[i.kind]}</span><b>${esc(i.title)}</b><p>${esc(i.text)}</p><u>Ask why →</u></button>`).join('')}</div>`:''}
<h3 class="sec">Dashboard <small style="color:var(--muted);font-weight:500">· click any bar or slice to explore it</small></h3>
<div class="grid">${a.charts.map((c,i)=>`<div class="card"><div class="chh"><b>${esc(c.title)}</b>${c.pin===false?'':`<button class="ib" data-act="pin" data-arg="a${i}" title="Pin to board">Pin</button>`}</div><div class="cv"><canvas id="c${i}"></canvas></div><details><summary>SQL behind this</summary><pre>${esc(c.sql)}</pre></details></div>`).join('')}</div>`};
AFTER.auto=()=>{if(!S.auto||S.auto.empty)return;countUp();S.auto.charts.forEach((c,i)=>draw($('#c'+i),c,c.dim?l=>ask(`Tell me more about "${l}" in ${c.dim.replace('.',' → ')}: trend over time and key numbers`):null))};
const ansHTML=(m,i)=>{if(m.pending)return`<div class="card"><div class="think"><i></i><i></i><i></i><span>Reading your data…</span></div></div>`;
if(m.err)return`<div class="card ans no"><p class="txt">${esc(m.err)}</p></div>`;const r=m.receipt||{},k=m.chart?.type==='kpi';
return`<div class="card ans ${m.answered?'ok':'no'}"><h4>${esc(m.title)}</h4><p class="txt">${esc(m.answer)}</p>
${k?`<div class="bigs">${m.chart.items.map((x,j)=>`<div style="border-top:4px solid var(--s${j*2+1})"><b>${fmt(x.value)}</b><small>${esc(x.label.replace(/_/g,' '))}</small></div>`).join('')}</div>`:m.chart?`<div class="cv"><canvas id="ac${i}"></canvas></div>`:''}
${m.rows?.length?`<details><summary>Table · ${m.rows.length}${m.truncated?'+':''} rows</summary><div class="tw"><table><tr>${m.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${m.rows.slice(0,200).map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table></div></details>`:''}
${m.sql?`<details><summary>${m.approach?esc(m.approach):'SQL'}</summary><pre>${esc(m.sql)}</pre></details>`:''}
<div class="rc"><b>Trust receipt</b>${(r.checks||[]).map(c=>`<span class="${c.ok?'ok':'bad'}">${c.ok?'✓':'✕'} ${esc(c.label)}</span>`).join('')}${m.answered?`<span>${r.rows}${r.truncated?'+':''} rows</span><span>${r.ms} ms</span><span>${esc((r.tables||[]).join(', '))}</span><span>${r.attempts>1?'self-corrected':'first try'}</span>`:''}<span>${esc(r.source||'')}</span></div>
${m.answered?`<div class="acts"><button data-act="pin" data-arg="m${i}">Pin to board</button><button data-act="csv" data-arg="${i}">CSV</button></div>`:''}
${m.followups?.length?`<div class="fu">${m.followups.map(f=>`<button data-act="ask" data-arg="${esc(f)}">${esc(f)}</button>`).join('')}</div>`:''}</div>`};
VIEWS.ask=()=>{const th=thread(),ideas=[...(S.auto?.insights||[]).map(i=>i.ask),'Give me an overview of this data','What are the biggest trends?'].slice(0,5);
return`<div class="thread">${th.length?th.map((m,i)=>`<div class="me">${esc(m.q)}</div>${ansHTML(m,i)}`).join(''):`<div class="empty"><h2>What do you want to know?</h2><p>Ask in plain English. Every answer shows the exact query and a safety receipt, so you can trust it.</p><div class="sug">${ideas.map(q=>`<button data-act="ask" data-arg="${esc(q)}">${esc(q)}</button>`).join('')}</div></div>`}</div>
<div class="comp"><div class="cf"><input id="qi" placeholder="Ask about your data…" autocomplete="off" aria-label="Your question"><button class="btn" data-act="send">Ask</button></div></div>`};
AFTER.ask=()=>{thread().forEach((m,i)=>{if(m.chart&&m.chart.type!=='kpi'&&$('#ac'+i))draw($('#ac'+i),m.chart,null)});const qi=$('#qi');qi&&qi.focus()};
const scrollEnd=()=>setTimeout(()=>scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),60);
async function ask(q){q=(q||'').trim();if(!q||!S.sid)return;if(S.view!=='ask'){S.view='ask'}const th=thread(),m={q,pending:1};th.push(m);render();scrollEnd();
try{Object.assign(m,await api(`/sources/${S.sid}/ask`,{method:'POST',body:{question:q,history:th.filter(x=>x.sql).slice(-2).map(x=>({q:x.q,sql:x.sql}))}}),{pending:0})}catch(e){m.pending=0;m.err=e.message}
render();scrollEnd()}

VIEWS.map=()=>!S.prof?skel(2):`<div class="mapintro"><div><h2>Your data, in orbit</h2><p>Explore how the words in your data connect. Drag a table, then follow its links.</p></div><div class="mapstat"><span><b>${S.prof.tables.length}</b> tables</span><span><b>${S.prof.tables.reduce((n,t)=>n+t.columns.length,0)}</b> fields</span><span><b>${S.prof.relationships.length}</b> discovered links</span></div></div><div class="card mapc"><canvas id="mapc"></canvas><div class="legend">✦ Table size reflects row count · hover to focus links · click a table to inspect</div></div><div class="card" id="mapinfo" style="margin-top:14px"><small style="color:var(--muted)">Select a table to reveal its fields, discovered relationships, and shortcuts.</small></div>`;
AFTER.map=()=>{if(!S.prof)return;const cv=$('#mapc'),x=cv.getContext('2d'),dpr=devicePixelRatio||1,R=cv.getBoundingClientRect();cv.width=R.width*dpr;cv.height=R.height*dpr;x.scale(dpr,dpr);
const P=['--s1','--s2','--s3','--s4','--s5','--s6','--s7'].map(cssv),T=S.prof.tables,mx=Math.max(...T.map(t=>t.rows),1),W=R.width,H=R.height;
const N=T.map((t,i)=>({t,i,x:W/2+Math.cos(i*2.4)*W*.25,y:H/2+Math.sin(i*2.4)*H*.25,vx:0,vy:0,r:18+30*Math.sqrt(t.rows/mx),c:P[i%7]}));const ix=Object.fromEntries(N.map(n=>[n.t.name,n]));
const E=S.prof.relationships.map(r=>({a:ix[r.from_table],b:ix[r.to_table],r})).filter(e=>e.a&&e.b&&(S.mapKind==='all'||!S.mapKind||(S.mapKind==='inferred'?e.r.how!=='foreign key':e.r.how===S.mapKind)));let drag=null,hov=null,moved=0;
const at=(px,py)=>N.find(n=>Math.hypot(n.x-px,n.y-py)<n.r+6);
const info=n=>{const rs=E.filter(e=>e.a===n||e.b===n);$('#mapinfo').innerHTML=`<h3 style="color:${n.c}">${esc(n.t.name)} <small style="color:var(--muted);font-weight:500">· ${n.t.rows.toLocaleString()} rows</small></h3><div class="chips" style="margin:10px 0">${n.t.columns.map(c=>`<span class="k k-${c.kind}" title="${c.kind}">${esc(c.name)}</span>`).join('')}</div>${rs.map(e=>`<div style="font-size:.85rem;color:var(--muted)">${esc(e.r.from_table)}.${esc(e.r.from_col)} → ${esc(e.r.to_table)}.${esc(e.r.to_col)} <i>(${esc(e.r.how)})</i></div>`).join('')}<div class="row"><button class="btn" data-act="tbl2" data-arg="${esc(n.t.name)}">Open dashboard</button><button class="btn ghost" data-act="ask" data-arg="Give me an overview of ${esc(n.t.name)}">Ask about it</button></div>`};
function frame(t){for(const a of N){for(const b of N){if(a===b)continue;let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1,f=(5200+(a.r+b.r)*60)/(d*d);a.vx+=dx/d*f;a.vy+=dy/d*f}a.vx+=(W/2-a.x)*.004;a.vy+=(H/2-a.y)*.004}
for(const e of E){const dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,d=Math.hypot(dx,dy)||1,f=(d-170)*.012;e.a.vx+=dx/d*f;e.a.vy+=dy/d*f;e.b.vx-=dx/d*f;e.b.vy-=dy/d*f}
for(const n of N){if(n===drag)continue;n.vx*=.8;n.vy*=.8;n.x=Math.max(n.r+8,Math.min(W-n.r-8,n.x+n.vx*.06));n.y=Math.max(n.r+8,Math.min(H-n.r-8,n.y+n.vy*.06))}
x.clearRect(0,0,W,H);
E.forEach((e,k)=>{const g=x.createLinearGradient(e.a.x,e.a.y,e.b.x,e.b.y);g.addColorStop(0,e.a.c);g.addColorStop(1,e.b.c);const focus=(S.mapPath||[]).includes([e.r.from_table,e.r.from_col,e.r.to_table,e.r.to_col].join('|'));x.strokeStyle=focus?'#ffd166':e.r.how==='foreign key'?'#d8a648':g;x.setLineDash(e.r.how==='foreign key'?[]:[5,5]);x.globalAlpha=hov&&hov!==e.a&&hov!==e.b?.12:focus?1:.58;x.lineWidth=focus?4:2.2;x.beginPath();x.moveTo(e.a.x,e.a.y);x.lineTo(e.b.x,e.b.y);x.stroke();x.setLineDash([]);
const u=((t/1800)+k*.27)%1;x.globalAlpha=1;x.fillStyle=e.a.c;x.beginPath();x.arc(e.a.x+(e.b.x-e.a.x)*u,e.a.y+(e.b.y-e.a.y)*u,3.6,0,7);x.fill()});
for(const n of N){const q=(S.mapSearch||'').toLowerCase().trim(),match=!q||n.t.name.toLowerCase().includes(q)||n.t.columns.some(c=>c.name.toLowerCase().includes(q));x.globalAlpha=!match?.12:hov&&hov!==n&&!E.some(e=>(e.a===hov&&e.b===n)||(e.b===hov&&e.a===n))?.3:1;const g=x.createRadialGradient(n.x,n.y,n.r*.2,n.x,n.y,n.r*2);g.addColorStop(0,n.c+'55');g.addColorStop(1,n.c+'00');x.fillStyle=g;x.beginPath();x.arc(n.x,n.y,n.r*2,0,7);x.fill();
const b=x.createRadialGradient(n.x-n.r*.3,n.y-n.r*.3,n.r*.1,n.x,n.y,n.r);b.addColorStop(0,'#ffffffcc');b.addColorStop(.25,n.c);b.addColorStop(1,n.c+'bb');x.fillStyle=b;x.beginPath();x.arc(n.x,n.y,n.r,0,7);x.fill();
x.fillStyle=cssv('--ink');x.font='700 12px Segoe UI,system-ui,sans-serif';x.textAlign='center';x.fillText(n.t.name,n.x,n.y+n.r+16);x.fillStyle=cssv('--muted');x.font='11px Segoe UI,system-ui,sans-serif';x.fillText(fmt(n.t.rows),n.x,n.y+n.r+29)}
x.globalAlpha=1;S.raf=requestAnimationFrame(frame)}
const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.onpointermove=e=>{const[px,py]=pt(e);if(drag){drag.x=px;drag.y=py;drag.vx=drag.vy=0;moved=1;return}const n=at(px,py);if(n!==hov){hov=n;cv.style.cursor=n?'pointer':'default';n&&info(n)}};
cv.onpointerdown=e=>{const[px,py]=pt(e),n=at(px,py);if(n){drag=n;moved=0;cv.setPointerCapture(e.pointerId);info(n)}};
cv.onpointerup=()=>{drag=null};cv.onpointerleave=()=>{hov=null};
S.raf=requestAnimationFrame(frame)};
VIEWS.map=()=>{if(!S.prof)return skel(2);const rs=S.prof.relationships,explicit=rs.filter(r=>r.how==='foreign key').length,tables=S.prof.tables;return`<div class="mapintro"><div><h2>Relationship lineage</h2><p>Inspect table references, see the evidence, and trace a path between tables.</p></div><div class="mapstat"><span><b>${tables.length}</b> tables</span><span><b>${explicit}</b> declared links</span><span><b>${rs.length-explicit}</b> inferred links</span></div></div><div class="maptools"><input id="map-search" value="${esc(S.mapSearch||'')}" placeholder="Search tables and fields…"><select id="map-kind"><option value="all">All relationship evidence</option><option value="foreign key" ${S.mapKind==='foreign key'?'selected':''}>Declared foreign keys</option><option value="inferred" ${S.mapKind==='inferred'?'selected':''}>Inferred links</option></select><select id="map-target"><option value="">Trace target table…</option>${tables.filter(t=>t.name!==S.mapSelected).map(t=>`<option value="${esc(t.name)}" ${S.mapTarget===t.name?'selected':''}>${esc(t.name)}</option>`).join('')}</select><button class="btn" data-act="mapTrace">Trace path</button><button class="btn ghost" data-act="mapClear">Clear focus</button></div><div class="card mapc"><canvas id="mapc"></canvas><div class="legend">Gold solid = declared foreign key · dashed = inferred · click a node to inspect</div></div><div class="card mapdetails" id="mapinfo"><small style="color:var(--muted)">Select a table to inspect fields, evidence, and reference impact.</small></div><p class="note">This map shows database references and heuristic matches. It does not claim to show ETL or transformation history. Validate inferred links before operational use.</p>`};
const mapAfterBase=AFTER.map;AFTER.map=()=>{mapAfterBase();if(!S.prof)return;const info=$('#mapinfo');const show=t=>{S.mapSelected=t.name;const rs=S.prof.relationships.filter(r=>r.from_table===t.name||r.to_table===t.name);info.innerHTML=`<h3 data-rich="1">${esc(t.name)} <small class="note">· ${t.rows.toLocaleString()} rows · ${t.columns.length} fields</small></h3><p class="note">${rs.filter(r=>r.from_table===t.name).length} references out · ${rs.filter(r=>r.to_table===t.name).length} tables reference this table</p><h4>Fields</h4><div class="mapfields">${t.columns.map(c=>`<div class="mapfield"><b>${esc(c.name)}</b> <span class="k k-${c.kind}">${esc(c.kind)}</span><div class="note">${c.nulls.toFixed(1)}% missing · ${fmt(c.distinct)} distinct</div></div>`).join('')}</div><h4>Relationship evidence (${rs.length})</h4>${rs.length?rs.map(r=>{const v=r.evidence||{},detail=v.kind==='value_overlap'?`${Math.round((v.match_rate||0)*100)}% matched in ${v.sample_size} sampled values`:v.kind==='name_match'?'Field names match; values were not checked':'Database foreign-key constraint';return`<div class="maprel"><b>${esc(r.from_table)}.${esc(r.from_col)}</b> → <b>${esc(r.to_table)}.${esc(r.to_col)}</b><span class="mapbadge">${r.how==='foreign key'?'Declared':'Inferred'} · ${esc(r.how)}</span><span class="note">${esc(detail)}</span></div>`}).join(''):'<p class="note">No relationships were found for this table.</p>'}<div class="row"><button class="btn" data-act="tbl2" data-arg="${esc(t.name)}">Open dashboard</button><button class="btn ghost" data-act="ask" data-arg="Give me an overview of ${esc(t.name)}">Ask about it</button></div>`};new MutationObserver(()=>{const h=info.querySelector('h3');if(!h||h.dataset.rich)return;const name=h.textContent.split(' ·')[0].trim(),t=S.prof.tables.find(x=>x.name===name);if(t)show(t)}).observe(info,{childList:true,subtree:true})};

VIEWS.board=()=>`<div class="grid" id="bd">${skel(2)}</div>`;
AFTER.board=async()=>{try{const b=await api('/board');const el=$('#bd');if(!el)return;
if(!b.length){el.innerHTML='<div class="card" style="grid-column:1/-1;text-align:center;padding:40px">Nothing pinned yet. Pin a chart from the Autopilot dashboard or any answer, and it will stay here, always re-run on live data.</div>';return}
el.innerHTML=b.map((p,i)=>`<div class="card" style="--i:${i}"><div class="chh"><b>${esc(p.title)}</b><button class="ib" data-act="unpin" data-arg="${p.id}" title="Remove">✕</button></div>${p.error?`<p style="color:var(--s1)">${esc(p.error)}</p>`:p.chart?.type==='kpi'?`<div class="bigs">${p.chart.items.map(x=>`<div><b>${fmt(x.value)}</b><small>${esc(x.label)}</small></div>`).join('')}</div>`:p.chart?`<div class="cv"><canvas id="bc${i}"></canvas></div>`:'<p>No chart for this result.</p>'}<small style="color:var(--muted)">${esc(p.source)} · live · ${p.rows||0} rows</small></div>`).join('');
pop();b.forEach((p,i)=>p.chart&&p.chart.type!=='kpi'&&draw($('#bc'+i),p.chart,null))}catch(e){toast(e.message,1)}};

VIEWS.data=()=>{if(!S.prof)return skel(3);const T=[...S.prof.tables].sort((a,b)=>a.name.localeCompare(b.name)),L=[...new Set(T.map(t=>t.name[0].toUpperCase()))];
return`<div class="card dlook"><input id="dq" class="cq" placeholder="Look up a table or column…" autocomplete="off"><div class="az">${L.map(l=>`<button data-act="az" data-arg="${l}">${l}</button>`).join('')}<span style="flex:1"></span><button class="chip" data-act="expDict">Export CSV</button><button class="chip" data-act="print">Print</button></div></div><div id="ents">${T.map(entry).join('')}</div>
<div class="card" id="gl" style="margin-top:14px"><h3>Business definitions</h3><p class="note">Teach Dictionary your terms. Definitions are applied to every question, so “revenue” always means what <i>you</i> mean.</p><div id="gll"></div><div class="gl"><input id="gt" placeholder="Term, e.g. active rider"><input id="gd" placeholder="Meaning, e.g. rider with a completed ride in the last 30 days" style="flex:3"><button class="btn" data-act="glAdd">Add</button></div></div>`};
const defn=(c,rel)=>{const r=rel.find(x=>x.from_col===c.name);switch(c.kind){case'id':return r?`Identifier. Links to ${r.to_table}.${r.to_col}.`:c.unique?'Unique identifier.':'Identifier.';case'measure':return`Numeric. Ranges ${fmt(c.min)} to ${fmt(c.max)}, averaging ${fmt(c.mean)}.`;case'category':return`Category with ${c.distinct} values${c.top&&c.top.length?', most often '+c.top.slice(0,3).map(x=>'“'+x[0]+'”').join(', '):''}.`;case'temporal':return`Date/time from ${String(c.min).slice(0,10)} to ${String(c.max).slice(0,10)}.`;case'boolean':return'Yes/no flag.';case'geo':return`Geographic coordinate, ${fmt(c.min)} to ${fmt(c.max)}.`;default:return`Free text${c.sample&&c.sample.length?', e.g. “'+c.sample[0]+'”':''}.`}};
function entry(t){const rel=S.prof.relationships.filter(r=>r.from_table===t.name),links=[...new Set(rel.map(r=>r.to_table))];
return`<article class="card entry" data-l="${esc(t.name[0].toUpperCase())}" data-k="${esc(t.name.toLowerCase())}"><h3><span>${esc(t.name)}</span><span class="pos">n. · table</span></h3><p class="def">A table of ${t.rows.toLocaleString()} records and ${t.columns.length} fields${links.length?', linked to '+links.map(esc).join(', '):''}.</p>${t.columns.map((c,i)=>`<div class="sense" data-c="${esc(c.name.toLowerCase())}"><span class="num">${i+1}.</span><b>${esc(c.name)} <span class="k k-${c.kind}">${c.kind}</span></b><em>${esc(defn(c,rel))}</em><span class="nb" title="${(100-c.nulls).toFixed(0)}% filled"><i style="width:${100-c.nulls}%"></i></span></div>`).join('')}</article>`}

S.qf={t:'all',s:'all'};
const SEVC={high:'var(--s1)',medium:'var(--s2)',low:'var(--s6)',info:'var(--muted)'},DIMS=[['completeness','Completeness'],['uniqueness','Uniqueness'],['validity','Validity'],['consistency','Consistency']];
const ring=v=>{const c=339.3,col=v>=90?'var(--s4)':v>=75?'var(--s2)':'var(--s1)';return`<svg class="ring" viewBox="0 0 140 140"><circle cx="70" cy="70" r="54" class="trk"/><circle cx="70" cy="70" r="54" class="prg" style="stroke:${col};stroke-dasharray:${c};stroke-dashoffset:${c*(1-v/100)}" transform="rotate(-90 70 70)"/><text x="70" y="70" text-anchor="middle" class="rv" data-v="${v}">${v}</text><text x="70" y="92" text-anchor="middle" class="rl">quality score</text></svg>`};
const scoreCol=v=>v>=90?'var(--s4)':v>=75?'var(--s2)':'var(--s1)';
const listText=v=>(v||[]).join(', ');
function contractPanel(q){const tables=S.prof?.tables||[];if(!tables.length)return'';const tn=S.contractTable||tables[0].name;S.contractTable=tn;const t=tables.find(x=>x.name===tn)||tables[0],spec=q.contracts?.specs?.[tn]||{};return`<div class="card"><div class="chh"><b>Data contracts</b><button class="chip" data-act="schemaBaseline">Save schema baseline</button></div><p class="note">Define required fields, unique keys, allowed values, and expected types. The scan checks these rules on every run.</p><div class="toolgrid"><label>Table<select id="contract-table">${tables.map(x=>`<option ${x.name===tn?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label>Required columns (comma separated)<input id="contract-required" value="${esc(listText(spec.required))}" placeholder="customer_id, email"></label><label>Unique columns<input id="contract-unique" value="${esc(listText(spec.unique))}" placeholder="id, email"></label><label class="toolwide">Allowed values (JSON object)<textarea id="contract-allowed" placeholder='{"status":["active","inactive"]}'>${esc(JSON.stringify(spec.allowed||{}))}</textarea></label><label class="toolwide">Expected types (JSON object)<textarea id="contract-types" placeholder='{"amount":"number","joined_at":"date"}'>${esc(JSON.stringify(spec.types||{}))}</textarea></label></div><div class="row"><button class="btn" data-act="saveContract">Save contract & scan</button><small class="note">${Object.keys(q.contracts?.specs||{}).length} table contracts configured</small></div></div>`}
function transformPanel(){const tables=S.prof?.tables||[];if(!tables.length)return'';const tn=S.trTable||tables[0].name;S.trTable=tn;const t=tables.find(x=>x.name===tn)||tables[0],cols=t.columns.map(c=>c.name),cn=S.trColumn||cols[0]||'',A=S.trActions||{};S.trColumn=cn;const opts=(value='')=>`<option value="">— none —</option>${cols.map(c=>`<option value="${esc(c)}" ${c===value?'selected':''}>${esc(c)}</option>`).join('')}`,sel=(v,x)=>v===x?'selected':'';const p=S.trPreview;return`<div class="card"><div class="chh"><b>Transformation engine</b><span class="k k-measure">Preview first · original data stays untouched</span></div><p class="note">Build a cleaned, standardized, or aggregated output. Preview the result, then download it as CSV.</p><div class="toolgrid"><label>Source table<select id="transform-table">${tables.map(x=>`<option ${x.name===tn?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label>Target column<select id="transform-column">${cols.map(c=>`<option ${c===cn?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>Null handling<select id="tr-nulls"><option value="keep" ${sel(A.nulls||'keep','keep')}>Keep nulls</option><option value="drop_rows" ${sel(A.nulls,'drop_rows')}>Drop rows missing target</option><option value="fill_value" ${sel(A.nulls,'fill_value')}>Fill with custom value</option><option value="fill_mean" ${sel(A.nulls,'fill_mean')}>Fill with mean</option><option value="fill_median" ${sel(A.nulls,'fill_median')}>Fill with median</option><option value="fill_mode" ${sel(A.nulls,'fill_mode')}>Fill with most common</option><option value="drop_column" ${sel(A.nulls,'drop_column')}>Drop target column</option></select></label><label>Custom fill value<input id="tr-fill" value="${esc(A.fill_value||'')}" placeholder="e.g. Unknown or 0"></label><label>Duplicates<select id="tr-dups"><option value="keep" ${sel(A.duplicates||'keep','keep')}>Keep all rows</option><option value="drop" ${sel(A.duplicates,'drop')}>Remove exact duplicate rows</option></select></label><label>Standardize text<select id="tr-text"><option value="none" ${sel(A.text||'none','none')}>No change</option><option value="trim" ${sel(A.text,'trim')}>Trim outer spaces</option><option value="normalize_spaces" ${sel(A.text,'normalize_spaces')}>Normalize repeated spaces</option><option value="lower" ${sel(A.text,'lower')}>lowercase</option><option value="upper" ${sel(A.text,'upper')}>UPPERCASE</option><option value="title" ${sel(A.text,'title')}>Title Case</option></select></label><label>Group by<select id="tr-group">${opts(A.group_by||'')}</select></label><label>Aggregate<select id="tr-agg"><option value="count" ${sel(A.aggregate||'count','count')}>Count rows</option><option value="sum" ${sel(A.aggregate,'sum')}>Sum</option><option value="mean" ${sel(A.aggregate,'mean')}>Average</option><option value="median" ${sel(A.aggregate,'median')}>Median</option><option value="min" ${sel(A.aggregate,'min')}>Minimum</option><option value="max" ${sel(A.aggregate,'max')}>Maximum</option></select></label><label>Numeric column<select id="tr-metric">${opts(A.aggregate_column||cn)}</select></label></div><div class="row"><button class="btn" data-act="transformPreview">Preview changes</button><button class="btn ghost" data-act="transformDownload">Download CSV</button><small class="note">Up to 200,000 rows per transformation.</small></div>${p?`<div class="preview"><b>Preview · ${fmt(p.output_rows)} output rows</b><small class="note">${fmt(p.input_rows)} input · ${fmt(p.removed_rows)} removed</small><div class="tw"><table><tr>${p.preview.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${p.preview.data.map(row=>`<tr>${row.map(v=>`<td>${v===null?'':esc(Array.isArray(v)?v.join(', '):v)}</td>`).join('')}</tr>`).join('')}</table></div></div>`:''}</div>`}
VIEWS.qa=()=>{const q=S.qa;if(!q)return`<div class="card scan"><div class="scanl"><i></i><i></i><i></i><i></i><i></i></div><p>Scanning every table: missing values, duplicates, outliers, dates, relationships…</p></div>`;
const f=S.qf,iss=q.issues.map((x,i)=>({...x,i})).filter(x=>(f.t==='all'||x.table===f.t)&&(f.s==='all'||x.sev===f.s)),tabs=q.tables.filter(t=>f.t==='all'||t.name===f.t);
return`<div class="card qhead">${ring(q.overall.score)}<div class="dims">${DIMS.map(d=>`<div class="dim"><span>${d[1]}</span><div class="db"><i style="width:${q.overall.dims[d[0]]}%;background:${scoreCol(q.overall.dims[d[0]])}"></i></div><b>${q.overall.dims[d[0]]}</b></div>`).join('')}<small class="note">${q.checks} checks across ${q.tables.length} tables${q.sampled?' (large tables sampled)':''}</small></div><div class="sevs">${['high','medium','low','info'].map(k=>`<div style="--a:${SEVC[k]}"><b>${q.counts[k]}</b><small>${k==='info'?'notes':k}</small></div>`).join('')}</div></div>
<div class="qualitytools">${contractPanel(q)}${transformPanel()}</div>
<div class="chips" style="margin-top:14px"><button class="chip ${f.t==='all'?'on':''}" data-act="qf" data-arg="t:all">All tables</button>${q.tables.map(t=>`<button class="chip ${f.t===t.name?'on':''}" data-act="qf" data-arg="t:${esc(t.name)}">${esc(t.name)} · ${t.score}</button>`).join('')}<span class="sepv"></span>${['high','medium','low'].map(k=>`<button class="chip ${f.s===k?'on':''}" data-act="qf" data-arg="s:${f.s===k?'all':k}">${k}</button>`).join('')}<button class="chip" data-act="qrun">Re-run</button><button class="chip" data-act="print">Export</button></div>
<h3 class="sec">Completeness map <small style="color:var(--muted);font-weight:500">· each block is a column, red = more missing</small></h3><div class="card">${tabs.map(t=>`<div class="mrow"><b>${esc(t.name)}</b><div class="mm">${t.cols.map((c,j)=>`<i style="--p:${Math.min(100,c.null_pct*2)};--j:${j}" title="${esc(c.name)} · ${c.null_pct}% missing"></i>`).join('')}</div><span style="color:${scoreCol(t.score)}">${t.score}</span></div>`).join('')}</div>
<h3 class="sec">Schema & contract checks</h3><div class="chips">${(q.schema||[]).map(t=>`<span class="chip">${esc(t.name)} · ${t.status}</span>`).join('')}<span class="note">${q.contracts?.issues?.length||0} contract violations · schema baseline records current field names and inferred types</span></div>
<h3 class="sec">Findings (${iss.length})</h3><div class="issues">${iss.length?iss.map(x=>`<div class="card iss" style="--a:${SEVC[x.sev]}"><div class="ih"><span class="sev">${x.sev==='info'?'NOTE':x.sev.toUpperCase()}</span><b>${esc(x.title)}</b><span class="where">${esc(x.table)}${x.column?'.'+esc(x.column):''}</span></div><p>${esc(x.detail)}</p><div class="imp"><i style="width:${Math.min(100,Math.max(3,x.pct))}%"></i></div><div class="acts"><button data-act="inspect" data-arg="${x.i}">Inspect rows</button>${x.column&&['nulls','blank','whitespace','negative','outliers','required','unique','allowed','type'].includes(x.check)?`<button data-act="investigate" data-arg="${x.i}">Investigate evidence</button>`:''}${S.health.llm?`<button data-act="ask" data-arg="${esc('Explain: '+x.title+' in '+x.table+(x.column?'.'+x.column:'')+'. Show examples and likely causes.')}">Ask AI</button>`:''}</div><details><summary>Suggested fix</summary><p>${esc(x.fix)}</p></details></div>`).join(''):'<div class="card" style="text-align:center;padding:30px">No findings match this filter. ✓ Nothing to fix here.</div>'}</div>`};
AFTER.qa=async()=>{if(S.qa){countUp();return}try{S.qa=await api(`/sources/${S.sid}/quality`);S.prof=await api(`/sources/${S.sid}/profile?refresh=true`);render();pop()}catch(e){toast(e.message,1)}};

async function glRender(){try{const g=await api(`/sources/${S.sid}/glossary`);const el=$('#gll');if(el)el.innerHTML=g.length?g.map((x,i)=>`<div class="term"><b>${esc(x.term)}</b><span>${esc(x.definition)}</span><button data-act="glDel" data-arg="${i}">✕</button></div>`).join(''):'<small style="color:var(--muted)">No terms yet.</small>'}catch(e){}}
AFTER.data=glRender;

/* ───────── modals & actions ───────── */
function modal(h,w){$('#modal').innerHTML=h?`<div class="bd" data-act="closeM"><div class="md${w?' wide':''}">${h}</div></div>`:''}
const addHTML=t=>`<h2>Connect data</h2><div class="tabs">${[['db','Database'],['file','Files'],['api','REST API'],['web','Web tables']].map(x=>`<button class="${t===x[0]?'on':''}" data-act="tab" data-arg="${x[0]}">${x[1]}</button>`).join('')}</div>
${t==='db'?`<label class="fld">Name<input id="fn" placeholder="Sales warehouse"></label><label class="fld">Connection URL<input id="fu" placeholder="postgresql+psycopg2://user:pass@host:5432/dbname"></label><p class="note">Also works with mysql+pymysql://… and sqlite:///path.db. Use a <b>read-only</b> database user. Credentials stay on your server in workspace/.</p><div class="row"><button class="btn" data-act="subDb">Connect</button></div>`
:t==='file'?`<label class="fld">Name (optional)<input id="fn" placeholder="Q3 exports"></label><label class="fld">Files<input id="ff" type="file" multiple accept=".csv,.tsv,.xlsx,.xls,.json,.parquet"></label><p class="note">CSV, TSV, Excel (every sheet becomes a table), JSON, Parquet. Several files together become one source you can join across.</p><div class="row"><button class="btn" data-act="subFile">Upload</button></div>`
:t==='api'?`<label class="fld">Name<input id="fn" placeholder="Orders API"></label><label class="fld">Endpoint URL<input id="fu" placeholder="https://api.example.com/v1/orders"></label><label class="fld">Headers (JSON, optional)<textarea id="fh" rows="2" placeholder='{"Authorization":"Bearer …"}'></textarea></label><label class="fld">Records path (optional)<input id="fp" placeholder="data.items"></label><p class="note">Dictionary fetches the JSON once and turns it into queryable tables. Internal addresses are blocked by default.</p><div class="row"><button class="btn" data-act="subApi">Fetch data</button></div>`:`<label class="fld">Name<input id="fn" placeholder="World indicators"></label><label class="fld">Public page URL<input id="fu" placeholder="https://example.org/statistics"></label><label class="fld">Table number (optional)<input id="ftable" type="number" min="1" placeholder="Import every table"></label><p class="note">Imports up to 20 static HTML tables from the page into queryable data. JavaScript-rendered pages and sign-in-only content are not supported. Public pages only; internal addresses are blocked.</p><div class="row"><button class="btn" data-act="subWeb">Scrape tables</button></div>`}
<div class="row" style="border-top:1px solid var(--line);padding-top:14px"><button class="btn ghost" data-act="sample">Or load the sample ride-share data</button><button class="btn ghost" data-act="close">Cancel</button></div>`;
const md=t=>{let h='',ul=0;String(t).split('\n').forEach(l=>{l=l.trim();if(!l)return;if(/^[-•*]\s/.test(l)){if(!ul){h+='<ul>';ul=1}h+=`<li>${esc(l.replace(/^[-•*]\s/,'')).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}</li>`}else{if(ul){h+='</ul>';ul=0}h+=`<p>${esc(l).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}</p>`}});return h+(ul?'</ul>':'')};
const busy=async(el,fn)=>{const t=el.textContent;el.disabled=true;el.textContent='Working…';try{await fn()}catch(e){toast(e.message,1)}finally{el.disabled=false;el.textContent=t}};
async function added(id){modal('');await loadSources();S.sid=id;S.view='auto';await load();toast('Connected. Dictionary is mapping your data.')}
const transformSpec=()=>{S.trTable=$('#transform-table')?.value||S.trTable;S.trColumn=$('#transform-column')?.value||S.trColumn;S.trActions={column:S.trColumn,nulls:$('#tr-nulls')?.value||'keep',fill_value:$('#tr-fill')?.value||'',duplicates:$('#tr-dups')?.value||'keep',text:$('#tr-text')?.value||'none',group_by:$('#tr-group')?.value||'',aggregate:$('#tr-agg')?.value||'count',aggregate_column:$('#tr-metric')?.value||S.trColumn};return{table:S.trTable,actions:S.trActions}};
async function refreshQuality(){S.qa=await api(`/sources/${S.sid}/quality`);S.trPreview=null;render()}
const ACT={
pick:g=>{S.sid=g;S.view=S.view==='ask'?'ask':'auto';load()},
delsrc:async g=>{if(!confirm('Remove this source and its pinned charts?'))return;try{await api('/sources/'+g,{method:'DELETE'});await loadSources();load()}catch(e){toast(e.message,1)}},
add:g=>{modal(addHTML(g||'db'))},tab:g=>modal(addHTML(g)),close:()=>modal(''),closeM:(g,el,e)=>{if(e.target===el)modal('')},
view:g=>go(g),home:()=>go('home'),theme:()=>{const d=document.documentElement,dark=d.dataset.theme!=='light';d.dataset.theme=dark?'light':'dark';render()},
tbl:async g=>{S.auto=null;render();try{S.auto=await api(`/sources/${S.sid}/autopilot?table=${encodeURIComponent(g)}`)}catch(e){toast(e.message,1)}render();pop()},
tbl2:g=>{S.view='auto';ACT.tbl(g)},ask:g=>ask(g),send:()=>ask($('#qi').value),print:()=>window.print(),
mapTrace:()=>{const from=S.mapSelected,to=$('#map-target')?.value||S.mapTarget;if(!from||!to)return toast('Select a source table and a trace target',1);S.mapTarget=to;const edges=S.prof.relationships,queue=[[from,[]]],seen=new Set([from]);let found=null;while(queue.length){const[node,path]=queue.shift();if(node===to){found=path;break}for(const r of edges){const next=r.from_table===node?r.to_table:r.to_table===node?r.from_table:null;if(next&&!seen.has(next)){seen.add(next);queue.push([next,[...path,r]])}}}if(!found){S.mapPath=[];$('#mapinfo').insertAdjacentHTML('beforeend',`<p class="mapbadge">No relationship path found from ${esc(from)} to ${esc(to)}.</p>`);return}S.mapPath=found.map(r=>[r.from_table,r.from_col,r.to_table,r.to_col].join('|'));$('#mapinfo').insertAdjacentHTML('beforeend',`<h4>Trace: ${esc(from)} → ${esc(to)}</h4><p class="note">${found.length} relationship${found.length===1?'':'s'} · path treats references as traversable in either direction</p>${found.map(r=>`<div class="maprel"><b>${esc(r.from_table)}.${esc(r.from_col)}</b> → <b>${esc(r.to_table)}.${esc(r.to_col)}</b><span class="mapbadge">${r.how==='foreign key'?'Declared':'Inferred'} · ${esc(r.how)}</span></div>`).join('')}`)},mapClear:()=>{S.mapSearch='';S.mapKind='all';S.mapSelected=null;S.mapTarget=null;S.mapPath=[];render()},
sample:async(g,el)=>busy(el,async()=>{const r=await api('/sources/sample',{method:'POST'});await added(r.id)}),
subDb:(g,el)=>busy(el,async()=>{await added((await api('/sources/db',{method:'POST',body:{name:$('#fn').value||'Database',url:$('#fu').value}})).id)}),
subFile:(g,el)=>busy(el,async()=>{const f=$('#ff').files;if(!f.length)throw new Error('Choose at least one file');const fd=new FormData();fd.append('name',$('#fn').value);[...f].forEach(x=>fd.append('files',x));await added((await api('/sources/file',{method:'POST',body:fd})).id)}),
subApi:(g,el)=>busy(el,async()=>{let h={};try{h=$('#fh').value.trim()?JSON.parse($('#fh').value):{}}catch{throw new Error('Headers must be valid JSON')}await added((await api('/sources/api',{method:'POST',body:{name:$('#fn').value||'API data',url:$('#fu').value,headers:h,path:$('#fp').value}})).id)}),
subWeb:(g,el)=>busy(el,async()=>{const n=$('#ftable').value;await added((await api('/sources/web',{method:'POST',body:{name:$('#fn').value||'Web tables',url:$('#fu').value,table:n?Number(n):null}})).id)}),
pin:async g=>{let o;if(g[0]==='a'){const c=S.auto.charts[+g.slice(1)];o={title:c.title,sql:c.sql}}else{const m=thread()[+g.slice(1)];o={title:m.title||m.q,sql:m.sql}}
try{await api('/board',{method:'POST',body:{source_id:S.sid,...o}});toast('Pinned to Board')}catch(e){toast(e.message,1)}},
unpin:async g=>{await api('/board/'+g,{method:'DELETE'});AFTER.board()},
csv:g=>{const m=thread()[+g],q=v=>`"${String(v??'').replace(/"/g,'""')}"`,t=[m.columns.map(q).join(','),...m.rows.map(r=>r.map(q).join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='dictionary-result.csv';a.click()},
glAdd:async()=>{const t=$('#gt').value.trim(),d=$('#gd').value.trim();if(!t||!d)return toast('Enter a term and its meaning',1);try{await api(`/sources/${S.sid}/glossary`,{method:'POST',body:{term:t,definition:d}});$('#gt').value=$('#gd').value='';glRender()}catch(e){toast(e.message,1)}},
glDel:async g=>{await api(`/sources/${S.sid}/glossary/${g}`,{method:'DELETE'});glRender()},
qf:g=>{S.qf[g[0]]=g.slice(2);render()},qrun:()=>{S.qa=null;render()},
saveContract:async(g,el)=>busy(el,async()=>{let allowed={},types={};try{allowed=$('#contract-allowed').value.trim()?JSON.parse($('#contract-allowed').value):{};types=$('#contract-types').value.trim()?JSON.parse($('#contract-types').value):{}}catch{throw new Error('Allowed values and types must be valid JSON objects')}const split=id=>$('#'+id).value.split(',').map(x=>x.trim()).filter(Boolean);await api(`/sources/${S.sid}/contracts`,{method:'PUT',body:{table:$('#contract-table').value,required:split('contract-required'),unique:split('contract-unique'),allowed,types}});await refreshQuality();toast('Contract saved and checked')}),
schemaBaseline:async()=>{try{await api(`/sources/${S.sid}/schema-baseline`,{method:'POST'});await refreshQuality();toast('Schema baseline updated')}catch(e){toast(e.message,1)}},
transformPreview:async(g,el)=>busy(el,async()=>{S.trTable=$('#transform-table').value;S.trColumn=$('#transform-column').value;S.trPreview=await api(`/sources/${S.sid}/transform/preview`,{method:'POST',body:transformSpec()});render()}),
transformDownload:async(g,el)=>busy(el,async()=>{S.trTable=$('#transform-table').value;const r=await fetch(`/api/sources/${S.sid}/transform/download`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(transformSpec())});if(!r.ok){let msg=r.statusText;try{msg=(await r.json()).detail||msg}catch{}throw new Error(msg)}const url=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=url;a.download='dictionary-transformed.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Transformed CSV downloaded')}),
investigate:async(g)=>{const x=S.qa.issues[+g];if(!x?.column)return;modal(`<h2>Evidence around ${esc(x.table)}.${esc(x.column)}</h2><div class="skel"></div>`,1);try{const r=await api(`/sources/${S.sid}/investigate`,{method:'POST',body:{table:x.table,column:x.column,check:x.check}});modal(`<h2>Evidence around ${esc(r.table)}.${esc(r.column)}</h2><p class="note">${esc(r.summary)} ${r.sampled?'Based on a sample of up to 50,000 rows.':''} ${fmt(r.affected)} affected sample rows.</p>${r.evidence.length?r.evidence.map(e=>`<div class="evidence"><b>${esc(e.column)}</b> · ${e.kind==='median'?`median ${fmt(e.affected)} among affected vs ${fmt(e.comparison)} among other rows (${e.difference_pct}% difference; n=${e.n_affected}/${e.n_comparison})`:`${esc(e.value)} · ${e.affected_rate}% affected across ${e.n} rows`}</div>`).join(''):'<p>No strong comparison signal in the available sample.</p>'}<div class="row"><button class="btn ghost" data-act="close">Close</button></div>`,1)}catch(e){modal('');toast(e.message,1)}},
az:g=>{const e=document.querySelector('.entry[data-l="'+g+'"]');e&&e.scrollIntoView({behavior:'smooth',block:'start'})},

inspect:async g=>{const x=S.qa.issues[+g];modal(`<h2>${esc(x.title)}</h2><div class="skel"></div>`,1);try{const r=await api(`/sources/${S.sid}/query`,{method:'POST',body:{sql:x.sql}});
modal(`<h2>${esc(x.title)}</h2><p class="note">${esc(x.detail)} Showing ${r.rows.length} row${r.rows.length===1?'':'s'}.</p><div class="tw"><table><tr>${r.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${r.rows.map(w=>`<tr>${w.map(v=>`<td>${v===null?'<i class="nl">null</i>':esc(v)}</td>`).join('')}</tr>`).join('')}</table></div><details><summary>SQL</summary><pre>${esc(x.sql)}</pre></details><div class="row"><button class="btn ghost" data-act="close">Close</button></div>`,1)}catch(e){modal('');toast(e.message,1)}},
cmd:()=>{modal(`<input class="cq" id="cq" placeholder="Ask a question or jump to…" autocomplete="off"><div class="row" style="margin-top:18px">${NAV.map(n=>`<button class="chip" data-act="goto" data-arg="${n[0]}">${n[2]} ${n[1]}</button>`).join('')}</div><p class="note">Press Enter to ask. Esc to close.</p>`);setTimeout(()=>$('#cq')?.focus(),30)},
goto:g=>{modal('');go(g)},
brief:async()=>{if(!S.sid)return;modal('<h2>Executive brief</h2><div class="skel"></div>');try{const r=await api(`/sources/${S.sid}/brief`,{method:'POST'});modal(`<h2>Executive brief</h2><div class="brief">${md(r.text)}</div>${r.ai?'':'<p class="note">Built from detected insights. Add a GEMINI_API_KEY for a narrated version.</p>'}<div class="row"><button class="btn" data-act="print">Print / save PDF</button><button class="btn ghost" data-act="close">Close</button></div>`)}catch(e){modal('');toast(e.message,1)}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;ACT[el.dataset.act]?.(el.dataset.arg,el,e)});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();ACT.cmd()}
else if(e.key==='Escape')modal('');else if(e.key==='Enter'){if(e.target.id==='qi')ask(e.target.value);else if(e.target.id==='cq'){const v=e.target.value;modal('');ask(v)}}});
document.addEventListener('change',e=>{if(e.target.id==='msel'){e.target.value==='+'?(e.target.value=S.sid,ACT.add()):ACT.pick(e.target.value)}else if(e.target.id==='map-kind'){S.mapKind=e.target.value;S.mapPath=[];render()}else if(e.target.id==='map-target'){S.mapTarget=e.target.value}else if(e.target.id==='contract-table'){S.contractTable=e.target.value;render()}else if(e.target.id==='transform-table'){S.trTable=e.target.value;S.trColumn=null;S.trPreview=null;render()}else if(e.target.id==='transform-column'){S.trColumn=e.target.value}});
document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.card');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',e.clientX-r.left+'px');c.style.setProperty('--my',e.clientY-r.top+'px')}});
document.addEventListener('input',e=>{if(e.target.id==='map-search'){S.mapSearch=e.target.value;const q=S.mapSearch.toLowerCase().trim(),n=S.prof.tables.filter(t=>!q||t.name.toLowerCase().includes(q)||t.columns.some(c=>c.name.toLowerCase().includes(q))).length;const i=$('#mapinfo');if(i)i.innerHTML=`<small class="note">${n} matching table${n===1?'':'s'} highlighted in the graph. Search checks table and field names.</small>`;return}if(e.target.id!=='dq')return;const v=e.target.value.toLowerCase().trim();document.querySelectorAll('#ents .entry').forEach(a=>{const th=!v||a.dataset.k.includes(v);let any=th;a.querySelectorAll('.sense').forEach(r=>{const h=th||r.dataset.c.includes(v);r.style.display=h?'':'none';if(h)any=true});a.style.display=any?'':'none'})});
(async()=>{try{S.health=await api('/health');await loadSources()}catch(e){toast('Cannot reach the Dictionary server',1)}await load()})();
</script>
</body>
</html>
